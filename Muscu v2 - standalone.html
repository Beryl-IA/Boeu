  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

enta) 45%, transparent);\n\n  --radius:   14px;\n  --radius-lg: 18px;\n  --radius-sm: 8px;\n\n  --danger:   #FF3D2E;\n  --warning:  #FFB400;\n}\n\n/* Mode clair — accents conservés */\n:root.light {\n  --bg:        #F4F4F2;\n  --surface:   #FFFFFF;\n  --surface2:  #EDEDEA;\n  --surface3:  #DCDCD7;\n  --border:    rgba(0,0,0,0.08);\n  --border-2:  rgba(0,0,0,0.14);\n  --text:      #0A0B0E;\n  --muted:     #6B6E7F;\n  --faint:     #B8BCC8;\n  --glow-lime:    0 0 0 transparent;\n  --glow-magenta: 0 0 0 transparent;\n}\n\n* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }\n\nhtml, body {\n  margin: 0; padding: 0;\n  font-family: var(--f-body);\n  background: var(--bg); color: var(--text);\n  line-height: 1.45;\n  letter-spacing: -0.01em;\n  padding-top: env(safe-area-inset-top);\n  padding-bottom: env(safe-area-inset-bottom);\n  overscroll-behavior: none;\n  -webkit-font-smoothing: antialiased;\n  transition: background 0.2s, color 0.2s;\n}\n\n/* Grille décorative en arrière-plan, contenue dans le viewport (pas le scroll) */\nbody::before {\n  content: '';\n  position: fixed; inset: 0;\n  background-image:\n    linear-gradient(var(--border) 1px, transparent 1px),\n    linear-gradient(90deg, var(--border) 1px, transparent 1px);\n  background-size: 32px 32px;\n  -webkit-mask-image: radial-gradient(ellipse at top, rgba(0,0,0,0.7), transparent 65%);\n          mask-image: radial-gradient(ellipse at top, rgba(0,0,0,0.7), transparent 65%);\n  pointer-events: none;\n  opacity: 0.5;\n  z-index: 0;\n}\n:root.light body::before { opacity: 0.35; }\n\n#app {\n  max-width: 600px;\n  margin: 0 auto;\n  padding: 14px 16px 120px;\n  min-height: 100vh;\n  position: relative;\n  z-index: 1;\n}\n\n/* ============================================================\n   TYPOGRAPHIE\n   ============================================================ */\nh1, h2, h3 {\n  font-family: var(--f-display);\n  font-weight: 900; letter-spacing: -0.03em;\n  }\nh1 { font-size: 1.7rem; line-height: 1; margin: 0; }\nh2 { font-size: 1.3rem; line-height: 1; margin: 18px 0 12px; }\nh3 { font-size: 1.05rem; line-height: 1.1; margin: 10px 0 8px; }\n\n.mono { font-family: var(--f-mono); }\n.uplabel {\n  font-family: var(--f-mono);\n  font-size: 0.65rem; font-weight: 700;\n  color: var(--muted);\n}\n.italic { }\n.text-lime { color: var(--lime); }\n.text-magenta { color: var(--magenta); }\n.text-cyan { color: var(--cyan); }\n.tabular { font-variant-numeric: tabular-nums; }\n\n/* ============================================================\n   BOUTONS\n   ============================================================ */\nbutton, .btn {\n  font-family: var(--f-display);\n  font-size: 0.95rem; font-weight: 900; letter-spacing: 0.06em; padding: 14px 18px;\n  border: none;\n  border-radius: var(--radius);\n  background: var(--lime);\n  color: var(--lime-ink);\n  cursor: pointer;\n  min-height: 46px;\n  transition: transform 0.15s, opacity 0.15s, box-shadow 0.2s;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  box-shadow: var(--glow-lime);\n}\n\nbutton:active, .btn:active {\n  transform: scale(0.97);\n  opacity: 0.92;\n}\nbutton:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }\n\n.btn-secondary {\n  background: var(--surface);\n  color: var(--text);\n  border: 1px solid var(--border-2);\n  box-shadow: none;\n  font-weight: 700;\n}\n.btn-danger {\n  background: var(--magenta);\n  color: var(--lime-ink);\n  box-shadow: var(--glow-magenta);\n}\n.btn-ghost {\n  background: transparent;\n  color: var(--muted);\n  padding: 8px 12px;\n  border: 1px solid var(--border);\n  box-shadow: none;\n  font-weight: 700;\n}\n.btn-small {\n  padding: 6px 10px;\n  font-size: 0.72rem;\n  min-height: 30px;\n  border-radius: 7px;\n}\n.btn-outline {\n  background: transparent;\n  color: var(--lime);\n  border: 1px solid var(--lime);\n  box-shadow: none;\n}\n\n/* Icon-only round button (header back/theme) */\n.icon-btn {\n  width: 40px; height: 40px;\n  padding: 0;\n  border-radius: 12px;\n  background: var(--surface);\n  color: var(--text);\n  border: 1px solid var(--border);\n  font-size: 1rem;\n  font-weight: 700;\n  box-shadow: none;\n  min-height: 40px;\n}\n\n/* ============================================================\n   CARTES\n   ============================================================ */\n.card {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-lg);\n  padding: 16px;\n  margin-bottom: 12px;\n  position: relative;\n  overflow: hidden;\n}\n\n.card-tappable {\n  cursor: pointer;\n  transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;\n}\n.card-tappable:active {\n  transform: scale(0.99);\n  border-color: var(--border-2);\n}\n.card-accent-lime {\n  border-color: color-mix(in srgb, var(--lime) 35%, transparent);\n}\n.card-accent-magenta {\n  border-color: color-mix(in srgb, var(--magenta) 45%, transparent);\n  box-shadow: var(--glow-magenta);\n}\n.card-stripe::before {\n  content: '';\n  position: absolute; top: 0; bottom: 0; left: 0;\n  width: 3px; background: var(--stripe, var(--lime));\n}\n.card-done { opacity: 0.55; }\n\n/* ============================================================\n   INPUTS\n   ============================================================ */\ninput, textarea, select {\n  font-family: inherit;\n  font-size: 1rem;\n  padding: 12px 14px;\n  border: 1px solid var(--border);\n  border-radius: var(--radius-sm);\n  background: var(--surface2);\n  color: var(--text);\n  width: 100%;\n  -webkit-appearance: none;\n  appearance: none;\n  letter-spacing: inherit;\n}\ninput:focus, textarea:focus, select:focus {\n  outline: none;\n  border-color: var(--lime);\n  box-shadow: 0 0 0 3px color-mix(in srgb, var(--lime) 18%, transparent);\n}\ntextarea { resize: vertical; min-height: 64px; line-height: 1.45; }\n\nlabel {\n  display: block;\n  font-family: var(--f-mono);\n  font-size: 0.7rem; font-weight: 700;\n  color: var(--muted);\n  margin-bottom: 6px;\n  margin-top: 14px;\n}\n\ninput[type=\"checkbox\"] { width: auto; }\n\n/* ============================================================\n   HEADER + BADGES\n   ============================================================ */\n.header {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  gap: 12px;\n  margin-bottom: 18px;\n}\n\n.header-titlewrap { text-align: center; flex: 1; }\n.header-titlewrap .uplabel { display: block; margin-bottom: 2px; }\n\n.badge {\n  display: inline-flex; align-items: center; gap: 4px;\n  background: var(--surface);\n  border: 1px solid var(--magenta);\n  color: var(--magenta);\n  padding: 5px 10px;\n  border-radius: 999px;\n  font-family: var(--f-mono);\n  font-weight: 700;\n  font-size: 0.7rem;\n  }\n.badge-lime {\n  border-color: var(--lime); color: var(--lime);\n}\n\n.badge-check {\n  display: inline-flex; align-items: center; justify-content: center;\n  background: var(--lime); color: var(--lime-ink);\n  width: 22px; height: 22px;\n  border-radius: 50%;\n  font-size: 0.7rem; font-weight: 900;\n}\n\n/* PR badge */\n.pr-badge {\n  display: inline-flex; align-items: center; gap: 4px;\n  background: var(--magenta); color: var(--lime-ink);\n  padding: 4px 8px;\n  border-radius: 6px;\n  font-family: var(--f-mono);\n  font-size: 0.65rem; font-weight: 900;\n  }\n\n/* ============================================================\n   LOGO\n   ============================================================ */\n.logo {\n  width: 40px; height: 40px;\n  border-radius: 12px;\n  background: linear-gradient(135deg, var(--lime), var(--cyan));\n  display: flex; align-items: center; justify-content: center;\n  font-family: var(--f-display); font-weight: 900; font-size: 1.35rem; color: var(--lime-ink);\n  letter-spacing: -0.04em;\n  flex-shrink: 0;\n}\n\n/* ============================================================\n   STREAK HERO (Accueil)\n   ============================================================ */\n.streak-hero {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-lg);\n  padding: 18px 18px 14px;\n  margin-bottom: 14px;\n  position: relative;\n  overflow: hidden;\n}\n.streak-hero::before {\n  content: '';\n  position: absolute; top: -50px; right: -50px;\n  width: 220px; height: 220px;\n  background: radial-gradient(circle, color-mix(in srgb, var(--lime) 22%, transparent), transparent 70%);\n  pointer-events: none;\n}\n.streak-hero-row {\n  display: flex; justify-content: space-between; align-items: flex-start;\n  gap: 10px; margin-bottom: 8px;\n  position: relative;\n}\n.streak-value {\n  font-family: var(--f-display);\n  font-weight: 900; font-size: 4.5rem; line-height: 0.85;\n  letter-spacing: -0.06em;\n  color: var(--lime);\n  text-shadow: 0 0 30px color-mix(in srgb, var(--lime) 55%, transparent);\n  font-variant-numeric: tabular-nums;\n}\n.streak-unit {\n  font-family: var(--f-display);\n  font-size: 1.1rem; font-weight: 700; color: var(--text);\n  margin-left: 4px;\n}\n:root.light .streak-value { text-shadow: none; }\n\n.led-row {\n  display: flex; gap: 4px; margin-top: 12px; position: relative;\n}\n.led {\n  flex: 1; height: 10px; border-radius: 2px;\n  background: var(--surface2);\n}\n.led.on {\n  background: var(--lime);\n  box-shadow: 0 0 6px color-mix(in srgb, var(--lime) 70%, transparent);\n}\n:root.light .led.on { box-shadow: none; }\n\n/* ============================================================\n   MANTRA / QUOTE\n   ============================================================ */\n.mantra {\n  padding: 12px 14px;\n  margin-bottom: 14px;\n  border: 1px dashed var(--border-2);\n  border-radius: var(--radius);\n  display: flex; gap: 10px; align-items: center;\n}\n.mantra-tag {\n  font-family: var(--f-mono);\n  font-size: 0.65rem; color: var(--magenta);\n  font-weight: 700; flex-shrink: 0;\n}\n.mantra-text {\n  font-size: 0.95rem; font-weight: 600; }\n\n/* ============================================================\n   SÉANCES (cartes accueil)\n   ============================================================ */\n.seance-head {\n  display: flex; justify-content: space-between; align-items: flex-end;\n  margin-bottom: 10px;\n}\n.seance-title-row {\n  display: flex; align-items: baseline; gap: 8px;\n}\n.seance-index {\n  font-family: var(--f-mono);\n  font-size: 0.7rem; font-weight: 700;\n  color: var(--muted); letter-spacing: 0.06em;\n}\n.seance-name {\n  font-family: var(--f-display);\n  font-size: 1.65rem; font-weight: 900; letter-spacing: -0.03em;\n  line-height: 0.95;\n}\n.seance-done .seance-name { text-decoration: line-through; }\n\n.run-btn {\n  background: var(--lime); color: var(--lime-ink);\n  padding: 9px 14px;\n  border-radius: 9px;\n  font-family: var(--f-display);\n  font-weight: 900; font-size: 0.78rem; letter-spacing: 0.08em;\n  box-shadow: var(--glow-lime);\n  min-height: 0;\n}\n\n.done-tag {\n  font-family: var(--f-mono);\n  font-size: 0.7rem; font-weight: 900;\n  color: var(--lime); }\n\n/* ============================================================\n   TAGS EXERCICES (chips)\n   ============================================================ */\n.exercise-tag {\n  display: inline-flex; align-items: center; gap: 4px;\n  background: var(--surface2);\n  border: 1px solid var(--border);\n  padding: 4px 10px 4px 7px;\n  border-radius: 999px;\n  font-size: 0.78rem; font-weight: 600;\n  color: var(--muted);\n  margin: 2px;\n}\n.exercise-emoji { font-size: 1.05rem; }\n.tag-row { display: flex; flex-wrap: wrap; gap: 4px; }\n\n/* ============================================================\n   SECTION HEADER (mini)\n   ============================================================ */\n.section-head {\n  display: flex; justify-content: space-between; align-items: baseline;\n  margin: 6px 4px 10px;\n}\n.section-head .uplabel { font-size: 0.7rem; }\n\n/* ============================================================\n   BIG INPUTS (Session)\n   ============================================================ */\n.input-group {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 10px;\n}\n.big-input {\n  background: var(--surface2);\n  border: 1px solid var(--border);\n  border-radius: 12px;\n  padding: 10px 12px 12px;\n}\n.big-input .uplabel {\n  display: block; margin-bottom: 4px;\n}\n.big-input-value {\n  display: flex; align-items: baseline; gap: 4px;\n  margin-bottom: 8px;\n}\n.big-input-value input {\n  font-family: var(--f-display);\n  font-size: 2.4rem; font-weight: 900; letter-spacing: -0.05em; line-height: 0.9;\n  color: var(--lime);\n  background: transparent; border: none; padding: 0;\n  font-variant-numeric: tabular-nums;\n  width: 100%;\n}\n.big-input-value input:focus { box-shadow: none; }\n.big-input-value .unit {\n  font-size: 0.7rem; font-weight: 700; color: var(--muted);\n  flex-shrink: 0;\n}\n.big-input.is-pr .big-input-value input { color: var(--magenta); }\n\n.big-input-controls {\n  display: flex; gap: 4px;\n}\n.big-input-controls button {\n  flex: 1; height: 28px; min-height: 0;\n  padding: 0;\n  border-radius: 7px;\n  font-size: 1rem;\n  font-weight: 900;\n  letter-spacing: 0;\n  text-transform: none;\n  font-style: normal;\n  box-shadow: none;\n}\n.big-input-controls .minus {\n  background: transparent;\n  border: 1px solid var(--border-2);\n  color: var(--text);\n}\n.big-input-controls .plus {\n  background: var(--lime); color: var(--lime-ink);\n}\n.big-input.is-pr .big-input-controls .plus { background: var(--magenta); }\n\n/* ============================================================\n   SPARKLINE / TREND CELL\n   ============================================================ */\n.trend-row {\n  display: flex; align-items: center; justify-content: space-between;\n  padding: 10px 12px;\n  background: var(--surface2);\n  border-radius: 10px;\n  margin-top: 10px;\n}\n.trend-left { display: flex; align-items: center; gap: 10px; }\n.trend-right { text-align: right; }\n.trend-value {\n  font-family: var(--f-display);\n  font-size: 1rem; font-weight: 900; letter-spacing: -0.02em;\n  font-variant-numeric: tabular-nums;\n}\n.trend-value-magenta { color: var(--magenta); }\n\n/* ============================================================\n   ELAPSED TIMER (Session)\n   ============================================================ */\n.timer-bar {\n  display: flex; justify-content: space-between; align-items: center;\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: 12px;\n  padding: 10px 14px;\n  margin-bottom: 14px;\n}\n.timer-value {\n  font-family: var(--f-mono);\n  font-size: 1.35rem; font-weight: 700;\n  color: var(--text); letter-spacing: -0.02em;\n}\n.timer-value .sec { color: var(--muted); }\n.timer-checks { display: flex; gap: 5px; }\n.timer-check {\n  width: 22px; height: 22px;\n  border-radius: 6px;\n  display: flex; align-items: center; justify-content: center;\n  background: var(--surface2); color: var(--muted);\n  font-family: var(--f-mono);\n  font-size: 0.65rem; font-weight: 700;\n}\n.timer-check.on { background: var(--lime); color: var(--lime-ink); }\n\n/* Progress bar at the top of session */\n.session-progress {\n  height: 4px; border-radius: 2px;\n  background: var(--surface2);\n  overflow: hidden;\n  margin-bottom: 16px;\n}\n.session-progress-fill {\n  height: 100%; background: var(--lime);\n  box-shadow: 0 0 8px var(--lime);\n  border-radius: 2px;\n  transition: width 0.3s;\n}\n\n/* ============================================================\n   EXERCISE BLOCK in session\n   ============================================================ */\n.exo-block {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius-lg);\n  padding: 16px;\n  margin-bottom: 12px;\n  position: relative;\n}\n.exo-block.is-pr {\n  border-color: color-mix(in srgb, var(--magenta) 55%, transparent);\n  box-shadow: 0 0 32px color-mix(in srgb, var(--magenta) 18%, transparent);\n}\n.exo-head {\n  display: flex; justify-content: space-between; align-items: flex-start;\n  gap: 12px; margin-bottom: 14px;\n}\n.exo-head-left {\n  display: flex; align-items: center; gap: 12px;\n  min-width: 0; flex: 1;\n}\n.exo-emoji-tile {\n  width: 46px; height: 46px; border-radius: 12px;\n  background: var(--surface2);\n  border: 1px solid var(--border);\n  display: flex; align-items: center; justify-content: center;\n  font-size: 1.5rem;\n  flex-shrink: 0;\n}\n.exo-name {\n  font-family: var(--f-display);\n  font-size: 1.05rem; font-weight: 900; letter-spacing: -0.02em;\n  line-height: 1.05;\n}\n.exo-meta {\n  font-family: var(--f-mono);\n  font-size: 0.7rem;\n  color: var(--muted);\n  font-weight: 700; margin-top: 3px;\n  letter-spacing: 0.04em;\n}\n\n/* Bandeau \"séance en cours / brouillon sauvegardé\" */\n.draft-banner {\n  display: flex; align-items: center; gap: 9px;\n  background: color-mix(in srgb, var(--lime) 7%, transparent);\n  border: 1px solid color-mix(in srgb, var(--lime) 22%, transparent);\n  border-radius: 10px;\n  padding: 9px 13px;\n  margin-bottom: 14px;\n  font-size: 0.74rem;\n  color: var(--muted);\n}\n.draft-dot {\n  width: 8px; height: 8px; border-radius: 50%;\n  background: var(--lime); flex-shrink: 0;\n  box-shadow: 0 0 8px var(--lime);\n  animation: draft-pulse 1.8s ease-in-out infinite;\n}\n:root.light .draft-dot { box-shadow: none; }\n@keyframes draft-pulse {\n  0%, 100% { opacity: 1; }\n  50% { opacity: 0.35; }\n}\n@media (prefers-reduced-motion: reduce) {\n  .draft-dot { animation: none; }\n}\n\n/* Planning hebdo (accueil) */\n.wk-strip { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 16px; }\n.wk-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }\n.wk-cell { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 0 8px; border-radius: 9px; background: var(--surface2); border: 1px solid transparent; }\n.wk-cell.today { border-color: var(--lime); }\n.wk-cell.past { opacity: 0.5; }\n.wk-day { font-family: var(--f-mono); font-size: 0.6rem; color: var(--muted); }\n.wk-cell.today .wk-day { color: var(--lime); }\n.wk-date { font-family: var(--f-display); font-weight: 900; font-size: 1rem; }\n.wk-dots { display: flex; gap: 3px; min-height: 7px; flex-wrap: wrap; justify-content: center; }\n.wk-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }\n.wk-dot.done { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }\n.plan-prompt { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px; margin-bottom: 16px; border-radius: 14px; border: 1px solid var(--lime); background: color-mix(in srgb, var(--lime) 7%, transparent); cursor: pointer; }\n.plan-prompt-title { font-family: var(--f-display); font-weight: 900; font-size: 1.2rem; margin: 2px 0; }\n.seance-day { font-family: var(--f-mono); font-size: 0.65rem; color: var(--muted); margin: -4px 0 8px; }\n.seance-day.today { color: var(--lime); }\n\n/* Vue planning */\n.wk-nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 16px; font-size: 0.8rem; }\n.day-chips { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }\n.day-chip { padding: 10px 0; min-height: 44px; font-family: var(--f-mono); font-size: 0.68rem; letter-spacing: 0.06em; background: var(--surface2); color: var(--muted); border: 1px solid var(--border); border-radius: 9px; box-shadow: none; }\n.day-chip.active { background: var(--c); color: var(--lime-ink); border-color: var(--c); font-weight: 700; }\n.recap-day { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }\n.recap-day:last-child { border-bottom: none; }\n.recap-day-label { display: flex; flex-direction: column; font-family: var(--f-display); font-weight: 800; font-size: 0.85rem; }\n.recap-day-label .mono { color: var(--muted); font-size: 0.7rem; font-weight: 400; }\n.recap-day.today .recap-day-label span:first-child { color: var(--lime); }\n.recap-day-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }\n.recap-seance { border-left: 3px solid var(--c); padding-left: 8px; }\n.recap-seance-name { font-weight: 700; font-size: 0.85rem; margin-bottom: 4px; }\n\n/* Stepper nb séances */\n.nb-seances { display: flex; align-items: center; justify-content: space-between; gap: 12px; }\n.nb-stepper { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }\n.nb-stepper button { width: 44px; height: 44px; padding: 0; font-size: 1.2rem; }\n.nb-value { font-family: var(--f-display); font-weight: 900; font-size: 1.6rem; min-width: 26px; text-align: center; }\n\n/* Ligne \"dernière augmentation de poids\" affichée dans la carte exo */\n.last-bump {\n  display: flex; align-items: center; gap: 8px;\n  background: linear-gradient(90deg, color-mix(in srgb, var(--lime) 10%, transparent), transparent);\n  border: 1px solid color-mix(in srgb, var(--lime) 25%, transparent);\n  border-left: 3px solid var(--lime);\n  padding: 6px 10px;\n  border-radius: 8px;\n  margin-bottom: 12px;\n}\n.last-bump-arrow {\n  font-family: var(--f-display);\n  font-weight: 900; font-size: 1.1rem; color: var(--lime);\n  text-shadow: 0 0 8px color-mix(in srgb, var(--lime) 60%, transparent);\n  line-height: 1;\n}\n:root.light .last-bump-arrow { text-shadow: none; }\n.last-bump-text {\n  display: inline-flex; align-items: baseline; gap: 6px;\n  flex-wrap: wrap; min-width: 0;\n}\n\n/* ============================================================\n   NAVIGATION BAS\n   ============================================================ */\n.bottom-nav {\n  position: fixed;\n  bottom: 0; left: 0; right: 0;\n  background: color-mix(in srgb, var(--bg) 85%, transparent);\n  -webkit-backdrop-filter: blur(14px);\n          backdrop-filter: blur(14px);\n  border-top: 1px solid var(--border);\n  display: flex; justify-content: space-around;\n  padding: 10px 0 calc(12px + env(safe-area-inset-bottom));\n  z-index: 100;\n}\n.bottom-nav button {\n  background: transparent;\n  color: var(--faint);\n  flex: 1; flex-direction: column;\n  font-family: var(--f-mono);\n  font-size: 0.6rem; font-weight: 900;\n  letter-spacing: 0.2em;\n  padding: 4px;\n  font-style: normal;\n  min-height: 50px;\n  gap: 3px;\n  box-shadow: none;\n  border-radius: 0;\n}\n.bottom-nav button.active { color: var(--lime); }\n.bottom-nav .icon-svg { display: block; }\n\n/* ============================================================\n   TABS (Paramétrage, Historique)\n   ============================================================ */\n.tabs {\n  display: flex; gap: 0;\n  margin-bottom: 16px;\n  background: var(--surface);\n  padding: 4px;\n  border: 1px solid var(--border);\n  border-radius: 12px;\n}\n.tab {\n  flex: 1;\n  padding: 10px;\n  background: transparent;\n  color: var(--muted);\n  font-family: var(--f-display);\n  font-weight: 700; font-size: 0.82rem; letter-spacing: 0.06em;\n  border-radius: 9px;\n  min-height: 0;\n  box-shadow: none;\n}\n.tab.active {\n  background: var(--surface2);\n  color: var(--lime);\n}\n\n/* ============================================================\n   EXERCISE ROW (catalogue, modale)\n   ============================================================ */\n.exercise-row {\n  display: flex; align-items: center;\n  padding: 12px 0;\n  border-bottom: 1px solid var(--border);\n  gap: 12px;\n}\n.exercise-row:last-child { border-bottom: none; }\n.exercise-row .name { flex: 1; font-weight: 600; }\n.row-actions { display: flex; gap: 4px; }\n\n/* ============================================================\n   MODALE\n   ============================================================ */\n.modal-overlay {\n  position: fixed; inset: 0;\n  background: rgba(0,0,0,0.7);\n  -webkit-backdrop-filter: blur(8px);\n          backdrop-filter: blur(8px);\n  display: flex; align-items: center; justify-content: center;\n  padding: 16px;\n  z-index: 1000;\n  animation: fadeIn 0.2s;\n}\n.modal {\n  background: var(--surface);\n  border: 1px solid var(--border-2);\n  border-radius: var(--radius-lg);\n  padding: 22px;\n  max-width: 500px;\n  width: 100%;\n  max-height: 90vh;\n  overflow-y: auto;\n  animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);\n  box-shadow: 0 20px 60px rgba(0,0,0,0.4);\n}\n.modal h3 {\n  font-size: 1.2rem;\n  margin: 0 0 14px;\n  color: var(--text);\n}\n.modal-actions {\n  display: flex; gap: 8px;\n  margin-top: 18px;\n  justify-content: flex-end;\n}\n\n@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }\n@keyframes slideUp {\n  from { transform: translateY(16px); opacity: 0; }\n  to { transform: translateY(0); opacity: 1; }\n}\n\n/* ============================================================\n   TOAST\n   ============================================================ */\n.toast {\n  position: fixed;\n  bottom: 100px; left: 50%;\n  transform: translateX(-50%);\n  background: var(--surface);\n  border: 1px solid var(--lime);\n  color: var(--text);\n  padding: 12px 18px;\n  border-radius: 10px;\n  font-family: var(--f-mono);\n  font-size: 0.82rem; font-weight: 500;\n  letter-spacing: 0.04em;\n  box-shadow: var(--glow-lime), 0 8px 24px rgba(0,0,0,0.35);\n  z-index: 2000;\n  animation: slideUp 0.3s;\n  max-width: 90%; text-align: center;\n}\n\n/* ============================================================\n   TABLEAU HISTORIQUE\n   ============================================================ */\n.table-wrapper {\n  overflow-x: auto;\n  border-radius: var(--radius-lg);\n  background: var(--surface);\n  border: 1px solid var(--border);\n  -webkit-overflow-scrolling: touch;\n}\ntable { width: 100%; border-collapse: collapse; font-size: 0.85rem; }\nth, td {\n  padding: 10px 10px;\n  text-align: left;\n  border-bottom: 1px solid var(--border);\n  white-space: nowrap;\n}\nth {\n  background: var(--surface2);\n  font-family: var(--f-mono);\n  font-weight: 700; font-size: 0.65rem;\n  color: var(--muted);\n  position: sticky; top: 0;\n}\ntr:last-child td { border-bottom: none; }\ntd.tabular { font-variant-numeric: tabular-nums; }\n\n/* ============================================================\n   DIVERS\n   ============================================================ */\n.text-muted { color: var(--muted); font-size: 0.85rem; }\n.text-center { text-align: center; }\n.flex { display: flex; }\n.flex-between { display: flex; justify-content: space-between; align-items: center; }\n.gap-8 { gap: 8px; }\n.mb-12 { margin-bottom: 12px; }\n.mt-16 { margin-top: 16px; }\n.hidden { display: none !important; }\n\n.empty-state {\n  text-align: center;\n  padding: 36px 16px;\n  color: var(--muted);\n}\n.empty-state svg { opacity: 0.4; margin-bottom: 12px; }\n\n.warning-box {\n  background: color-mix(in srgb, var(--amber) 8%, transparent);\n  border: 1px solid color-mix(in srgb, var(--amber) 35%, transparent);\n  border-left: 3px solid var(--amber);\n  padding: 10px 14px;\n  border-radius: var(--radius-sm);\n  margin: 8px 0;\n  font-size: 0.88rem;\n  color: var(--text);\n}\n\n.notes-precedentes {\n  background: var(--surface2);\n  border: 1px solid var(--border);\n  border-left: 3px solid var(--muted);\n  padding: 10px 14px;\n  border-radius: var(--radius-sm);\n  margin: 12px 0 0;\n  font-size: 0.88rem;\n}\n.notes-precedentes-label {\n  font-family: var(--f-mono);\n  font-weight: 700;\n  color: var(--muted);\n  font-size: 0.62rem;\n  margin-bottom: 4px;\n  }\n.notes-precedentes-content {\n  color: var(--text);\n  white-space: pre-wrap;\n  line-height: 1.45;\n}\n\n/* Stat block (sauvegarde, etc.) */\n.stat-line {\n  display: flex; justify-content: space-between; align-items: baseline;\n  padding: 10px 0;\n  border-bottom: 1px solid var(--border);\n}\n.stat-line:last-child { border-bottom: none; }\n.stat-line .label {\n  font-family: var(--f-mono);\n  font-size: 0.7rem; color: var(--muted);\n  font-weight: 700;\n}\n.stat-line .value {\n  font-family: var(--f-display);\n  font-size: 1.4rem; font-weight: 900; letter-spacing: -0.02em;\n  color: var(--text);\n}\n\n/* Streak grid (registre) */\n.streak-grid {\n  display: grid; grid-template-columns: repeat(14, 1fr);\n  gap: 3px;\n  padding: 10px;\n  border: 1px solid var(--border);\n  border-radius: 10px;\n  background: var(--surface);\n}\n.streak-cell {\n  aspect-ratio: 1;\n  display: flex; align-items: center; justify-content: center;\n  font-family: var(--f-mono); font-size: 0.55rem;\n  font-weight: 700;\n  border-radius: 3px;\n}\n.streak-cell.on {\n  background: var(--lime); color: var(--lime-ink);\n  box-shadow: 0 0 4px color-mix(in srgb, var(--lime) 55%, transparent);\n}\n.streak-cell.off {\n  background: var(--surface2); color: var(--faint);\n}\n:root.light .streak-cell.on { box-shadow: none; }\n\n/* ============================================================\n   SAVE / VICTORY OVERLAY\n   ============================================================ */\n.save-overlay {\n  position: fixed; inset: 0; z-index: 2000;\n  background: var(--bg);\n  display: flex; flex-direction: column;\n  align-items: center; justify-content: center;\n  gap: 18px;\n  overflow: hidden;\n  animation: saveFade 2.4s ease forwards;\n}\n.save-overlay-msg {\n  font-family: var(--f-mono);\n  font-size: 0.78rem; color: var(--lime);\n  letter-spacing: 0.3em; font-weight: 700;\n}\n.save-overlay-title {\n  font-family: var(--f-display);\n  font-size: 3.6rem; font-weight: 900; color: var(--lime); letter-spacing: -0.05em; line-height: 0.9;\n  text-shadow: 0 0 30px var(--lime);\n  animation: saveGlitch .25s linear 2;\n  text-align: center;\n}\n:root.light .save-overlay-title { text-shadow: none; }\n.save-overlay-stats {\n  display: flex; gap: 22px;\n  font-family: var(--f-mono);\n  font-size: 0.72rem; font-weight: 700;\n  color: var(--muted);\n  text-align: center; }\n.save-overlay-stat .v {\n  display: block;\n  font-family: var(--f-display);\n  font-size: 1.6rem; font-weight: 900; letter-spacing: -0.04em;\n  margin-top: 4px;\n  color: var(--lime);\n}\n.save-overlay-stat .v.magenta { color: var(--magenta); }\n.save-overlay-stat .v.cyan { color: var(--cyan); }\n.scan {\n  position: absolute; left: 0; right: 0; height: 80px;\n  background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--lime) 25%, transparent), transparent);\n  animation: saveScan 1.8s linear;\n}\n@keyframes saveScan {\n  0% { transform: translateY(-100%); }\n  100% { transform: translateY(100vh); }\n}\n@keyframes saveFade {\n  0% { opacity: 0; }\n  6% { opacity: 1; }\n  85% { opacity: 1; }\n  100% { opacity: 0; pointer-events: none; }\n}\n@keyframes saveGlitch {\n  0%   { transform: translate(0); }\n  20%  { transform: translate(-3px, 2px); }\n  40%  { transform: translate(3px, -2px); }\n  60%  { transform: translate(-2px, -1px); }\n  80%  { transform: translate(2px, 1px); }\n  100% { transform: translate(0); }\n}\n\n/* PR ribbon */\n.pr-ribbon {\n  background: linear-gradient(90deg, var(--magenta), transparent);\n  color: var(--lime-ink);\n  padding: 8px 14px;\n  border-radius: 8px;\n  margin: 8px 0;\n  font-family: var(--f-mono);\n  font-size: 0.72rem; font-weight: 700;\n  display: flex; align-items: center; gap: 8px;\n  }\n\n/* Tabs select for historique inputs etc. */\nselect { cursor: pointer; }\nselect::-ms-expand { display: none; }\n\n/* ============================================================\n   IMAGE SLOTS — déposes pour images perso (poster, screens, etc.)\n   ============================================================ */\n.image-slot {\n  width: 100%;\n  aspect-ratio: 16 / 9;\n  border-radius: var(--radius-lg);\n  border: 1px dashed var(--border-2);\n  background: var(--surface);\n  display: flex; align-items: center; justify-content: center;\n  position: relative; overflow: hidden;\n  margin-bottom: 14px;\n  cursor: pointer;\n  transition: border-color 0.15s, transform 0.15s;\n  background-size: cover;\n  background-position: center;\n}\n.image-slot:hover { border-color: var(--lime); }\n.image-slot.has-image {\n  border-style: solid;\n  border-color: var(--border);\n}\n.image-slot.has-image .image-slot-hint { display: none; }\n.image-slot.dragover {\n  border-color: var(--lime);\n  border-style: solid;\n  box-shadow: var(--glow-lime);\n}\n.image-slot-hint {\n  font-family: var(--f-mono);\n  font-size: 0.75rem;\n  font-weight: 700;\n  letter-spacing: 0.2em;\n  color: var(--muted);\n  text-align: center; padding: 12px;\n}\n/* Halftone overlay (effet manga) sur les images-slot remplis */\n.image-slot.has-image::after {\n  content: '';\n  position: absolute; inset: 0;\n  background:\n    radial-gradient(circle at 30% 30%, transparent 0%, rgba(10,11,14,0.5) 100%),\n    repeating-radial-gradient(circle at 25% 25%, rgba(0,0,0,0.4) 0px, rgba(0,0,0,0.4) 1px, transparent 1px, transparent 4px);\n  mix-blend-mode: multiply;\n  pointer-events: none;\n}\n.image-slot .slot-clear {\n  position: absolute; top: 8px; right: 8px;\n  width: 28px; height: 28px; min-height: 0;\n  border-radius: 14px; padding: 0;\n  background: rgba(10,11,14,0.7);\n  color: var(--text);\n  border: 1px solid var(--border-2);\n  font-size: 0.7rem;\n  z-index: 2;\n  box-shadow: none;\n  font-style: normal;\n  letter-spacing: 0;\n  display: none;\n}\n.image-slot.has-image .slot-clear { display: flex; }\n\n/* Hero home : un peu plus petit */\n.image-slot[data-slot-id=\"hero-home\"] {\n  aspect-ratio: 21 / 9;\n}\n\n/* ============================================================\n   MANGA FX — halftone, speed lines, screen shake, onomatopée\n   ============================================================ */\n.halftone-overlay {\n  position: absolute; inset: 0; pointer-events: none;\n  background-image: radial-gradient(circle, rgba(0,0,0,0.55) 1px, transparent 1.5px);\n  background-size: 5px 5px;\n  mix-blend-mode: multiply;\n  opacity: 0.7;\n}\n\n/* Speed lines (animation explosive depuis le centre) */\n@keyframes speedLines :0.8rem!important;font-weight:700}\n\n.bottom-nav{background:color-mix(in srgb,var(--bg) 82%,transparent);border-top:0.5px solid var(--border);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6)}\n.bottom-nav button{font-family:var(--f-body);letter-spacing:0;text-transform:none;font-weight:500;font-size:0.7rem;color:var(--muted);min-height:50px}\n.bottom-nav button.active{color:var(--lime)}\n.tabs{background:var(--surface);border:none;border-radius:12px;padding:3px}\n.tab{font-family:var(--f-body);font-style:normal;text-transform:none;letter-spacing:0;font-weight:600;font-size:0.9rem;border-radius:10px;min-height:36px;padding:8px}\n.tab.active{background:var(--surface3);color:var(--text)}\n.exercise-row{border-bottom:0.5px solid var(--border)}\n.exercise-row .name{font-weight:500}\n\n.modal-overlay{background:rgba(0,0,0,0.55)}\n.modal{border:none;border-radius:26px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,0.5)}\n.toast{border:none;background:var(--surface3);border-radius:999px;font-family:var(--f-body);letter-spacing:0;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,0.4);padding:12px 20px}\n.table-wrapper{border:none}\nth{font-family:var(--f-body);letter-spacing:0;text-transform:none;font-size:0.78rem;font-weight:600}\nth,td{border-bottom:0.5px solid var(--border)}\n.warning-box{border:none;background:color-mix(in srgb,var(--amber) 11%,transparent);border-radius:14px;padding:12px 14px}\n.warning-box strong{color:var(--amber)!important;font-family:var(--f-body)!important;font-size:0.82rem!important}\n.notes-precedentes{border:none;background:var(--surface2);border-radius:14px}\n.notes-precedentes-label{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:0.78rem;font-weight:600}\n.notes-precedentes-content{font-style:normal}\n.stat-line{border-bottom:0.5px solid var(--border)}\n.stat-line .label{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:0.9rem;font-weight:500}\n.stat-line .value{font-family:var(--f-display);font-style:normal;font-weight:700}\n.streak-grid{border:none}\n.streak-cell{font-family:var(--f-body);border-radius:50%}\n.streak-cell.on{box-shadow:none}\n\n.save-overlay-msg{font-family:var(--f-body);letter-spacing:0;font-weight:600;font-size:0.95rem}\n.save-overlay-title{font-family:var(--f-display);font-style:normal;font-weight:700;letter-spacing:-0.03em;text-shadow:none;animation:none;font-size:2.8rem}\n.save-overlay-stats{font-family:var(--f-body);letter-spacing:0;text-transform:none;font-weight:500;font-size:0.85rem}\n.save-overlay-stat .v{font-family:var(--f-display);font-style:normal;font-weight:700}\n.scan,.ono,.speed-lines,.halftone-overlay{display:none!important}\n.impact-burst::before{display:none}\n.shake{animation:none}\n.pr-ribbon{background:color-mix(in srgb,var(--magenta) 15%,transparent);color:var(--magenta);font-family:var(--f-body);letter-spacing:0;text-transform:none;border-radius:12px}\n.image-slot{border-radius:var(--radius-lg)}\n.image-slot.has-image::after{display:none}\n.image-slot-hint{font-family:var(--f-body);letter-spacing:0}\n\n.variant-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}\n.variant-opt{flex-direction:column;gap:10px;background:var(--surface2);color:var(--text);padding:14px 8px 12px;border-radius:16px;font-size:0.85rem;font-weight:600;min-height:0;box-shadow:inset 0 0 0 2px transparent}\n.variant-opt.active{box-shadow:inset 0 0 0 2px var(--lime)}\n.variant-sw{display:flex;gap:4px}\n.variant-sw span{width:16px;height:16px;border-radius:50%}\n.variant-preview{width:100%;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center}\n\n<\u002Fstyle>\n<script>(function(){try{var v=localStorage.getItem('muscu-variant')||'graphite';document.documentElement.dataset.variant=v;}catch(e){document.documentElement.dataset.variant='graphite';}})();<\u002Fscript>\n<\u002Fhead>\n<body>\n\n\n<!-- Initialisation du thème AVANT le rendu (évite le flash) -->\n<script>\n(function() {\n  try {\n    var saved = localStorage.getItem('muscu-theme');\n    // Par défaut: thème sombre (Neon Garage). 'light' force le clair.\n    if (saved === 'light') document.documentElement.classList.add('light');\n  } catch (e) {}\n})();\n<\u002Fscript>\n\n<div id=\"app\">\n  <!-- Le contenu est rendu dynamiquement par render() -->\n  <div class=\"text-center\" style=\"padding: 40px;\">Chargement...<\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Conteneur des modales et toasts -->\n<div id=\"modal-root\"><\u002Fdiv>\n<div id=\"toast-root\"><\u002Fdiv>\n\n<script>\n/* ============================================================================\n   SECTION 1 : CONSTANTES ET MAPPING GROUPES MUSCULAIRES\n   ============================================================================ */\n\n// Mapping figé groupe musculaire -> emoji et libellé\nconst GROUPES = {\n  'epaules':    { emoji: '🥥', label: 'Épaules' },\n  'biceps':     { emoji: '💪', label: 'Biceps' },\n  'triceps':    { emoji: '🥩', label: 'Triceps' },\n  'avant-bras': { emoji: '🦞', label: 'Avant-bras' },\n  'pecs':       { emoji: '🍍', label: 'Pectoraux' },\n  'dos':        { emoji: '🦍', label: 'Dos' }\n};\n\n// Constantes de l'application\nconst DB_NAME = 'muscuDB';\nconst DB_VERSION = 1;\nconst STORES = {\n  EXERCICES: 'exercices',\n  SEANCES: 'seances',\n  PERFORMANCES: 'performances',\n  ETAT: 'etat'\n};\n\n// Générateur d'UUID simple (suffisant pour usage local mono-utilisateur)\nfunction uuid() {\n  return 'x-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 9);\n}\n\n/* ============================================================================\n   SECTION 2 : PERSISTANCE INDEXEDDB\n   ============================================================================ */\n\nlet db = null;\n\n// Ouverture de la base IndexedDB et création des object stores si nécessaire\nfunction openDB() {\n  return new Promise((resolve, reject) => {\n    const req = indexedDB.open(DB_NAME, DB_VERSION);\n\n    req.onupgradeneeded = (e) => {\n      const database = e.target.result;\n      if (!database.objectStoreNames.contains(STORES.EXERCICES)) {\n        database.createObjectStore(STORES.EXERCICES, { keyPath: 'id' });\n      }\n      if (!database.objectStoreNames.contains(STORES.SEANCES)) {\n        database.createObjectStore(STORES.SEANCES, { keyPath: 'id' });\n      }\n      if (!database.objectStoreNames.contains(STORES.PERFORMANCES)) {\n        const store = database.createObjectStore(STORES.PERFORMANCES, { keyPath: 'id' });\n        store.createIndex('exerciceId', 'exerciceId', { unique: false });\n        store.createIndex('seanceId', 'seanceId', { unique: false });\n      }\n      if (!database.objectStoreNames.contains(STORES.ETAT)) {\n        database.createObjectStore(STORES.ETAT, { keyPath: 'id' });\n      }\n    };\n\n    req.onsuccess = (e) => { db = e.target.result; resolve(db); };\n    req.onerror = (e) => reject(e.target.error);\n  });\n}\n\n// Helpers génériques sur les object stores\nfunction txStore(storeName, mode = 'readonly') {\n  return db.transaction(storeName, mode).objectStore(storeName);\n}\n\nfunction getAll(storeName) {\n  return new Promise((resolve, reject) => {\n    const req = txStore(storeName).getAll();\n    req.onsuccess = () => resolve(req.result);\n    req.onerror = () => reject(req.error);\n  });\n}\n\nfunction getOne(storeName, id) {\n  return new Promise((resolve, reject) => {\n    const req = txStore(storeName).get(id);\n    req.onsuccess = () => resolve(req.result);\n    req.onerror = () => reject(req.error);\n  });\n}\n\nfunction putOne(storeName, value) {\n  return new Promise((resolve, reject) => {\n    const req = txStore(storeName, 'readwrite').put(value);\n    req.onsuccess = () => resolve(value);\n    req.onerror = () => reject(req.error);\n  });\n}\n\nfunction deleteOne(storeName, id) {\n  return new Promise((resolve, reject) => {\n    const req = txStore(storeName, 'readwrite').delete(id);\n    req.onsuccess = () => resolve();\n    req.onerror = () => reject(req.error);\n  });\n}\n\nfunction clearStore(storeName) {\n  return new Promise((resolve, reject) => {\n    const req = txStore(storeName, 'readwrite').clear();\n    req.onsuccess = () => resolve();\n    req.onerror = () => reject(req.error);\n  });\n}\n\n/* ============================================================================\n   SECTION 3 : INITIALISATION DES DONNÉES AU PREMIER LANCEMENT\n   ============================================================================ */\n\n// Crée les 4 séances par défaut et l'état initial si la base est vide\nasync function initialiserSiVide() {\n  const seances = await getAll(STORES.SEANCES);\n  if (seances.length === 0) {\n    for (let i = 1; i <= 4; i++) {\n      await putOne(STORES.SEANCES, {\n        id: 'seance-' + i,\n        nom: 'Séance ' + i,\n        exercicesIds: []\n      });\n    }\n  }\n  const etat = await getOne(STORES.ETAT, 'global');\n  if (!etat) {\n    await putOne(STORES.ETAT, {\n      id: 'global',\n      semaineCourante: 1,\n      seancesFaitesCetteSemaine: []\n    });\n  }\n}\n\n/* ============================================================================\n   SECTION 4 : ÉTAT EN MÉMOIRE ET ROUTAGE\n   ============================================================================ */\n\n// État global de l'app en mémoire (rechargé après chaque modification)\nconst State = {\n  vue: 'accueil',         // 'accueil' | 'session' | 'parametrage' | 'historique' | 'sauvegarde'\n  vueParams: {},          // paramètres contextuels (ex. seanceId pour la vue session)\n  exercices: [],\n  seances: [],\n  performances: [],\n  etat: null,\n  // Pour la vue Paramétrage : onglet actif\n  ongletParam: 'catalogue'  // 'catalogue' | 'composition'\n};\n\n// Recharge tout depuis IndexedDB puis rend la vue actuelle\nasync function rafraichir() {\n  State.exercices = await getAll(STORES.EXERCICES);\n  State.seances = (await getAll(STORES.SEANCES)).sort((a, b) => numSeance(a.id) - numSeance(b.id));\n  State.performances = await getAll(STORES.PERFORMANCES);\n  State.etat = await getOne(STORES.ETAT, 'global');\n  render();\n}\n\n// Change de vue\nfunction naviguer(vue, params = {}) {\n  State.vue = vue;\n  State.vueParams = params;\n  render();\n  window.scrollTo(0, 0);\n}\n\n/* ============================================================================\n   SECTION 5 : LOGIQUE MÉTIER\n   ============================================================================ */\n\n// Récupère la dernière performance enregistrée pour un exercice donné (toutes séances)\nfunction dernierePerformance(exerciceId) {\n  const perfs = State.performances\n    .filter(p => p.exerciceId === exerciceId)\n    .sort((a, b) => {\n      if (b.semaine !== a.semaine) return b.semaine - a.semaine;\n      return b.dateISO.localeCompare(a.dateISO);\n    });\n  return perfs[0] || null;\n}\n\n// Construit les valeurs pré-remplies pour un exercice en début de séance.\n// Le poids et les reps sont pré-remplis depuis la dernière performance ;\n// les notes ne sont PAS pré-remplies (champ vide à chaque séance), les\n// anciennes notes étant affichées séparément en lecture seule.\nfunction valeursPreRemplies(exercice) {\n  const derniere = dernierePerformance(exercice.id);\n  return {\n    poids: derniere ? derniere.poids : exercice.poidsInitial,\n    reps:  derniere ? derniere.repsSerie4 : exercice.repsPrevues,\n    anciennesNotes: derniere ? (derniere.notes || '') : (exercice.notesParDefaut || '')\n  };\n}\n\n// Récupère le dernier commentaire global pour une séance donnée (par seanceId).\n// Utilisé pour afficher en lecture seule le ressenti de la séance précédente.\nfunction dernierCommentaireDeSeance(seanceId) {\n  const perfs = State.performances\n    .filter(p => p.seanceId === seanceId && p.commentaireSeance)\n    .sort((a, b) => {\n      if (b.semaine !== a.semaine) return b.semaine - a.semaine;\n      return b.dateISO.localeCompare(a.dateISO);\n    });\n  if (perfs.length === 0) return null;\n  return {\n    texte: perfs[0].commentaireSeance,\n    semaine: perfs[0].semaine\n  };\n}\n\n/* ----------------------------------------------------------------------------\n   BROUILLON DE SÉANCE EN COURS (persistance locale)\n   Permet de quitter l'appli pendant une séance et de retrouver toutes les\n   saisies (poids, reps, notes par exo + commentaire) au retour.\n   Stocké dans localStorage, clé indexée par séance + semaine courante.\n---------------------------------------------------------------------------- */\nconst BROUILLON_PREFIX = 'muscu-brouillon-';\n\nfunction cleBrouillon(seanceId) {\n  return BROUILLON_PREFIX + seanceId + '-s' + (State.etat ? State.etat.semaineCourante : 0);\n}\n\nfunction chargerBrouillon(seanceId) {\n  try {\n    const brut = localStorage.getItem(cleBrouillon(seanceId));\n    return brut ? JSON.parse(brut) : null;\n  } catch (e) { return null; }\n}\n\nfunction sauvegarderBrouillon(seanceId, brouillon) {\n  try { localStorage.setItem(cleBrouillon(seanceId), JSON.stringify(brouillon)); }\n  catch (e) {}\n}\n\nfunction effacerBrouillon(seanceId) {\n  try { localStorage.removeItem(cleBrouillon(seanceId)); } catch (e) {}\n}\n\n// Collecte l'état courant des champs de la séance et l'enregistre en brouillon.\nfunction capturerBrouillon(seanceId) {\n  if (!seanceId) return;\n  const brouillon = { maj: Date.now(), exos: {}, commentaire: '' };\n  document.querySelectorAll('[data-exercice-id]').forEach(carte => {\n    const exId = carte.dataset.exerciceId;\n    const poids = carte.querySelector('[data-champ=\"poids\"]');\n    const reps = carte.querySelector('[data-champ=\"reps\"]');\n    const notes = carte.querySelector('[data-champ=\"notes\"]');\n    brouillon.exos[exId] = {\n      poids: poids ? poids.value : '',\n      reps: reps ? reps.value : '',\n      notes: notes ? notes.value : ''\n    };\n  });\n  const com = document.getElementById('commentaire-seance');\n  if (com) brouillon.commentaire = com.value;\n  sauvegarderBrouillon(seanceId, brouillon);\n}\n\n// Enregistre une séance complète : crée 1 performance par exercice + met à jour l'état\nasync function enregistrerSeance(seanceId, donneesParExercice, commentaireSeance) {\n  const semaine = State.etat.semaineCourante;\n  const dateISO = new Date().toISOString();\n\n  // Créer une performance par exercice\n  for (const [exerciceId, data] of Object.entries(donneesParExercice)) {\n    await putOne(STORES.PERFORMANCES, {\n      id: uuid(),\n      exerciceId,\n      seanceId,\n      semaine,\n      dateISO,\n      poids: data.poids,\n      repsSerie4: data.reps,\n      notes: data.notes,\n      commentaireSeance: commentaireSeance || ''\n    });\n  }\n\n  // Mise à jour de l'état : marquer la séance comme faite cette semaine\n  const nouvelEtat = { ...State.etat };\n  if (!nouvelEtat.seancesFaitesCetteSemaine.includes(seanceId)) {\n    nouvelEtat.seancesFaitesCetteSemaine.push(seanceId);\n  }\n  // Si 4 séances faites, on passe à la semaine suivante\n  if (nouvelEtat.seancesFaitesCetteSemaine.length >= State.seances.length) {\n    nouvelEtat.semaineCourante += 1;\n    nouvelEtat.seancesFaitesCetteSemaine = [];\n  }\n  await putOne(STORES.ETAT, nouvelEtat);\n}\n\n// Passe manuellement à la semaine suivante\nasync function passerSemaineSuivante() {\n  const nouvelEtat = {\n    ...State.etat,\n    semaineCourante: State.etat.semaineCourante + 1,\n    seancesFaitesCetteSemaine: []\n  };\n  await putOne(STORES.ETAT, nouvelEtat);\n}\n\n/* ----------------------------------------------------------------------------\n   NOMBRE DE SÉANCES / SEMAINE + PLANNING HEBDOMADAIRE\n---------------------------------------------------------------------------- */\nconst SEANCE_COLORS = ['var(--lime)', 'var(--magenta)', 'var(--cyan)', 'var(--amber)'];\nconst JOURS = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'];\nconst JOURS_LONGS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];\n\nfunction numSeance(id) { const m = String(id).match(/(\\d+)$/); return m ? parseInt(m[1]) : 0; }\nfunction isoLocal(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }\nfunction depuisIso(iso) { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); }\nfunction jourIndex(d) { return (d.getDay() + 6) % 7; }\nfunction lundiDe(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - jourIndex(x)); return x; }\nfunction ajouterJours(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }\n// Le dimanche, on planifie la semaine qui commence le lendemain\nfunction lundiCiblePlanning() { const t = new Date(); return jourIndex(t) === 6 ? ajouterJours(lundiDe(t), 7) : lundiDe(t); }\nfunction getPlanning(lundiIso) { return ((State.etat && State.etat.plannings) || {})[lundiIso] || {}; }\nfunction libelleSemaine(lundi) {\n  const dim = ajouterJours(lundi, 6);\n  const f = d => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });\n  return `du ${f(lundi)} au ${f(dim)}`;\n}\n\nasync function enregistrerPlanning(lundiIso, plan) {\n  const plannings = { ...((State.etat && State.etat.plannings) || {}) };\n  plannings[lundiIso] = plan;\n  await putOne(STORES.ETAT, { ...State.etat, plannings });\n}\n\nasync function definirJourSeance(lundiIso, seanceId, jour) {\n  const plan = { ...getPlanning(lundiIso) };\n  if (plan[seanceId] === jour) delete plan[seanceId]; else plan[seanceId] = jour;\n  await enregistrerPlanning(lundiIso, plan);\n}\n\nasync function repartitionAuto(lundiIso) {\n  const n = State.seances.length;\n  const plan = {};\n  State.seances.forEach((s, i) => { plan[s.id] = Math.min(6, Math.round(i * 7 / n)); });\n  await enregistrerPlanning(lundiIso, plan);\n}\n\nasync function changerNbSeances(n) {\n  const cible = Math.max(1, Math.min(7, n));\n  const cur = State.seances;\n  if (cible === cur.length) return;\n  if (cible > cur.length) {\n    let maxNum = Math.max(0, ...cur.map(s => numSeance(s.id)));\n    for (let k = cur.length + 1; k <= cible; k++) {\n      maxNum++;\n      await putOne(STORES.SEANCES, { id: 'seance-' + maxNum, nom: 'Séance ' + k, exercicesIds: [] });\n    }\n  } else {\n    const retirees = cur.slice(cible);\n    if (retirees.some(s => s.exercicesIds.length > 0)) {\n      const ok = await confirmer(\n        `${retirees.map(s => s.nom).join(', ')} contien${retirees.length > 1 ? 'nent' : 't'} des exercices et ser${retirees.length > 1 ? 'ont' : 'a'} supprimée${retirees.length > 1 ? 's' : ''}. L'historique des performances est conservé.`,\n        'Supprimer'\n      );\n      if (!ok) return;\n    }\n    const ids = retirees.map(s => s.id);\n    for (const id of ids) { await deleteOne(STORES.SEANCES, id); effacerBrouillon(id); }\n    const plannings = { ...(State.etat.plannings || {}) };\n    Object.keys(plannings).forEach(k => {\n      const p = { ...plannings[k] }; ids.forEach(id => delete p[id]); plannings[k] = p;\n    });\n    State.etat = {\n      ...State.etat,\n      plannings,\n      seancesFaitesCetteSemaine: State.etat.seancesFaitesCetteSemaine.filter(id => !ids.includes(id))\n    };\n  }\n  await putOne(STORES.ETAT, { ...State.etat, nbSeances: cible });\n  await rafraichir();\n}\n\n// Réinitialise entièrement le programme : efface l'historique de performances,\n// remet la semaine à 1, vide les séances faites cette semaine et tous les brouillons.\n// Conserve le catalogue d'exercices et la composition des séances.\nasync function reinitialiserProgramme() {\n  await clearStore(STORES.PERFORMANCES);\n  await putOne(STORES.ETAT, {\n    id: 'global',\n    semaineCourante: 1,\n    seancesFaitesCetteSemaine: []\n  });\n  // Purge tous les brouillons de séance en cours\n  try {\n    if (State.etat && State.etat.plannings) {\n      const e2 = await getOne(STORES.ETAT, 'global');\n      await putOne(STORES.ETAT, { ...e2, plannings: State.etat.plannings });\n    }\n    Object.keys(localStorage)\n      .filter(k => k.startsWith(BROUILLON_PREFIX))\n      .forEach(k => localStorage.removeItem(k));\n  } catch (e) {}\n}\n\n// Vérifie quelles séances utilisent un exercice donné\nfunction seancesUtilisantExercice(exerciceId) {\n  return State.seances.filter(s => s.exercicesIds.includes(exerciceId));\n}\n\n/* ============================================================================\n   SECTION 5.5 : HELPERS NEON GARAGE (sparkline, PR, 1RM, streak, theme, icons)\n   ============================================================================ */\n\n// Formule d'Epley : estimation du 1RM (1 rep max)\nfunction epley1RM(poids, reps) {\n  if (!poids || !reps) return 0;\n  return Math.round(poids * (1 + reps / 30) * 10) / 10;\n}\n\n// Historique des performances pour un exercice, ordre chronologique croissant\nfunction histoExercice(exerciceId, limite = 8) {\n  return State.performances\n    .filter(p => p.exerciceId === exerciceId)\n    .sort((a, b) => {\n      if (a.semaine !== b.semaine) return a.semaine - b.semaine;\n      return a.dateISO.localeCompare(b.dateISO);\n    })\n    .slice(-limite);\n}\n\n// Détecte si la dernière performance d'un exercice est le PR (1RM le plus élevé jamais atteint)\nfunction estPRActuel(exerciceId) {\n  const perfs = State.performances.filter(p => p.exerciceId === exerciceId);\n  if (perfs.length < 2) return false;\n  perfs.sort((a, b) => {\n    if (a.semaine !== b.semaine) return a.semaine - b.semaine;\n    return a.dateISO.localeCompare(b.dateISO);\n  });\n  const last = perfs[perfs.length - 1];\n  const lastRM = epley1RM(last.poids, last.repsSerie4);\n  const maxAvant = Math.max(...perfs.slice(0, -1).map(p => epley1RM(p.poids, p.repsSerie4)));\n  return lastRM > maxAvant;\n}\n\n// Trouve la dernière fois où le poids a été AUGMENTÉ pour un exercice\n// Retourne { semaine, dateISO, ancienPoids, nouveauPoids, delta } ou null\nfunction derniereAugmentationPoids(exerciceId) {\n  const perfs = State.performances\n    .filter(p => p.exerciceId === exerciceId)\n    .sort((a, b) => {\n      if (a.semaine !== b.semaine) return a.semaine - b.semaine;\n      return a.dateISO.localeCompare(b.dateISO);\n    });\n  if (perfs.length < 2) return null;\n  // Parcourir du plus récent au plus ancien\n  for (let i = perfs.length - 1; i >= 1; i--) {\n    if (perfs[i].poids > perfs[i - 1].poids) {\n      return {\n        semaine: perfs[i].semaine,\n        dateISO: perfs[i].dateISO,\n        ancienPoids: perfs[i - 1].poids,\n        nouveauPoids: perfs[i].poids,\n        delta: +(perfs[i].poids - perfs[i - 1].poids).toFixed(2)\n      };\n    }\n  }\n  return null;\n}\n\n// Formate une date ISO en libellé français court (ex. \"12 mars\")\nfunction formatDateCourte(iso) {\n  try {\n    return new Date(iso).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });\n  } catch (e) { return ''; }\n}\n\n// Formate un timestamp en heure courte française (ex. \"18h42\")\nfunction formatHeure(ts) {\n  try {\n    const d = new Date(ts);\n    return d.getHours() + 'h' + String(d.getMinutes()).padStart(2, '0');\n  } catch (e) { return ''; }\n}\n\n// Le meilleur 1RM jamais réalisé pour un exercice (PR record)\nfunction meilleurPR(exerciceId) {\n  const perfs = State.performances.filter(p => p.exerciceId === exerciceId);\n  if (perfs.length === 0) return null;\n  let best = null;\n  for (const p of perfs) {\n    const rm = epley1RM(p.poids, p.repsSerie4);\n    if (!best || rm > best.oneRM) {\n      best = { oneRM: rm, semaine: p.semaine, poids: p.poids, reps: p.repsSerie4 };\n    }\n  }\n  return best;\n}\n\n// Calcule le nombre de semaines complètes consécutives (4 séances / semaine) avant la semaine en cours\nfunction calculerStreak() {\n  if (!State.etat) return 0;\n  const semCourante = State.etat.semaineCourante;\n  // Compter, pour chaque semaine passée, combien de séances distinctes ont été enregistrées\n  const seancesParSem = {};\n  for (const p of State.performances) {\n    if (p.semaine >= semCourante) continue;\n    if (!seancesParSem[p.semaine]) seancesParSem[p.semaine] = new Set();\n    seancesParSem[p.semaine].add(p.seanceId);\n  }\n  const nbSeancesTotales = State.seances.length || 4;\n  let streak = 0;\n  for (let sem = semCourante - 1; sem >= 1; sem--) {\n    if (seancesParSem[sem] && seancesParSem[sem].size >= nbSeancesTotales) {\n      streak++;\n    } else {\n      break;\n    }\n  }\n  return streak;\n}\n\n// Génère un SVG sparkline à partir des dernières performances de poids\nfunction sparklineSVG(values, opts = {}) {\n  const {\n    w = 80, h = 24,\n    color = 'var(--lime)',\n    glow = true,\n    fill = false,\n  } = opts;\n  if (!values || values.length < 2) {\n    return `<svg width=\"${w}\" height=\"${h}\"><line x1=\"0\" y1=\"${h-1}\" x2=\"${w}\" y2=\"${h-1}\" stroke=\"${color}\" stroke-opacity=\"0.3\" stroke-width=\"1\"/><\u002Fsvg>`;\n  }\n  const min = Math.min(...values), max = Math.max(...values);\n  const range = max - min || 1;\n  const pts = values.map((v, i) => {\n    const x = (i / (values.length - 1)) * (w - 2) + 1;\n    const y = h - ((v - min) / range) * (h - 4) - 2;\n    return [x, y];\n  });\n  const d = pts.map((p, i) => (i === 0 ? `M${p[0]},${p[1]}` : `L${p[0]},${p[1]}`)).join(' ');\n  const last = pts[pts.length - 1];\n  const area = `${d} L${w-1},${h-1} L1,${h-1} Z`;\n  const filter = glow ? `style=\"filter: drop-shadow(0 0 4px ${color})\"` : '';\n  return `\n    <svg width=\"${w}\" height=\"${h}\" ${filter}>\n      ${fill ? `<path d=\"${area}\" fill=\"${color}\" opacity=\"0.15\"/>` : ''}\n      <path d=\"${d}\" stroke=\"${color}\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n      <circle cx=\"${last[0]}\" cy=\"${last[1]}\" r=\"2.8\" fill=\"${color}\"/>\n    <\u002Fsvg>\n  `;\n}\n\n// SVG icons pour la nav et les boutons\nconst ICONS = {\n  home: '<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\"><path d=\"M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1v-9z\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"/><\u002Fsvg>',\n  gear: '<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"3\" stroke=\"currentColor\" stroke-width=\"2\"/><path stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" d=\"M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1\"/><\u002Fsvg>',\n  chart: '<svg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\"><path d=\"M4 19V9M10 19V5M16 19v-7M22 19H2\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"/><\u002Fsvg>',\n  back: '<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\"><path d=\"M14 6l-6 6 6 6\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>',\n  sun: '<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"4\" stroke=\"currentColor\" stroke-width=\"2\"/><path stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" d=\"M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"/><\u002Fsvg>',\n  moon: '<svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\"><path d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linejoin=\"round\"/><\u002Fsvg>',\n  trophy: '<svg viewBox=\"0 0 24 24\" width=\"12\" height=\"12\" fill=\"currentColor\"><path d=\"M19 4h-2V2H7v2H5a2 2 0 0 0-2 2v3a4 4 0 0 0 4 4h.4a6 6 0 0 0 3.6 3.2V18H8v2h8v-2h-3v-1.8a6 6 0 0 0 3.6-3.2H17a4 4 0 0 0 4-4V6a2 2 0 0 0-2-2zM5 9V6h2v4.7A2 2 0 0 1 5 9zm14 0a2 2 0 0 1-2 1.7V6h2v3z\"/><\u002Fsvg>',\n  arrow: '<svg viewBox=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\"><path d=\"M5 12h14M13 6l6 6-6 6\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>',\n};\n\n
