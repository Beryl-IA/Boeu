{\n  const dump = {\n    version: 1,\n    dateExport: new Date().toISOString(),\n    exercices: State.exercices,\n    seances: State.seances,\n    performances: State.performances,\n    etat: State.etat\n  };\n  const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });\n  const url = URL.createObjectURL(blob);\n  const a = document.createElement('a');\n  const date = new Date().toISOString().slice(0, 10);\n  a.href = url;\n  a.download = `muscu-${date}.json`;\n  document.body.appendChild(a);\n  a.click();\n  document.body.removeChild(a);\n  URL.revokeObjectURL(url);\n  toast('Export téléchargé');\n}\n\nasync function importerDonnees(e) {\n  const file = e.target.files[0];\n  if (!file) return;\n\n  try {\n    const texte = await file.text();\n    const data = JSON.parse(texte);\n\n    // Validation minimale\n    if (!data.exercices || !data.seances || !data.performances || !data.etat) {\n      throw new Error('Structure du fichier invalide.');\n    }\n    if (!Array.isArray(data.exercices) || !Array.isArray(data.seances) || !Array.isArray(data.performances)) {\n      throw new Error('Format des données invalide.');\n    }\n\n    const ok = await confirmer(\n      'Cela écrasera <strong>toutes<\u002Fstrong> vos données actuelles. Continuer ?',\n      'Écraser et importer'\n    );\n    if (!ok) {\n      e.target.value = '';\n      return;\n    }\n\n    // Effacer puis réinsérer\n    await clearStore(STORES.EXERCICES);\n    await clearStore(STORES.SEANCES);\n    await clearStore(STORES.PERFORMANCES);\n    await clearStore(STORES.ETAT);\n\n    for (const ex of data.exercices) await putOne(STORES.EXERCICES, ex);\n    for (const s of data.seances) await putOne(STORES.SEANCES, s);\n    for (const p of data.performances) await putOne(STORES.PERFORMANCES, p);\n    await putOne(STORES.ETAT, data.etat);\n\n    await rafraichir();\n    toast('Données importées ✅');\n  } catch (err) {\n    await modal(`\n      <h3 style=\"margin-top: 0;\">❌ Import échoué<\u002Fh3>\n      <p>Fichier invalide ou corrompu.<\u002Fp>\n      <p class=\"text-muted\">${escapeHtml(err.message)}<\u002Fp>\n      <div class=\"modal-actions\">\n        <button data-action=\"ok\">OK<\u002Fbutton>\n      <\u002Fdiv>\n    `);\n    setTimeout(() => {\n      const overlay = document.querySelector('.modal-overlay:last-child');\n      overlay.querySelector('button').onclick = () => overlay.fermer();\n    }, 0);\n  } finally {\n    e.target.value = '';\n  }\n}\n\n/* ============================================================================\n   SECTION 19 : UTILITAIRES\n   ============================================================================ */\n\n// Échappement HTML pour prévenir l'injection (utile car le contenu vient de l'utilisateur)\nfunction escapeHtml(str) {\n  if (str === null || str === undefined) return '';\n  return String(str)\n    .replace(/&/g, '&amp;')\n    .replace(/<\u002Fg, '&lt;')\n    .replace(/>/g, '&gt;')\n    .replace(/\"/g, '&quot;')\n    .replace(/'/g, '&#039;');\n}\n\n/* ============================================================================\n   SECTION 20 : PWA - MANIFEST ET SERVICE WORKER\n   ============================================================================ */\n\n// Construction du manifest PWA et injection dans le DOM via Blob URL\nfunction installerManifestPWA() {\n  const manifest = {\n    name: \"Suivi Musculation\",\n    short_name: \"Muscu\",\n    description: \"Application personnelle de suivi d'entraînement\",\n    start_url: \".\",\n    scope: \".\",\n    display: \"standalone\",\n    orientation: \"portrait\",\n    background_color: \"#ffffff\",\n    theme_color: \"#10b981\",\n    icons: [\n      {\n        src: \"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='40' fill='%23ffffff'/><rect x='12' y='72' width='24' height='48' rx='6' fill='%2310b981'/><rect x='156' y='72' width='24' height='48' rx='6' fill='%2310b981'/><rect x='36' y='84' width='14' height='24' fill='%2310b981'/><rect x='142' y='84' width='14' height='24' fill='%2310b981'/><rect x='50' y='88' width='92' height='16' rx='8' fill='%2310b981'/><\u002Fsvg>\",\n        sizes: \"192x192\",\n        type: \"image/svg+xml\",\n        purpose: \"any\"\n      },\n      {\n        src: \"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='100' fill='%23ffffff'/><rect x='32' y='192' width='64' height='128' rx='16' fill='%2310b981'/><rect x='416' y='192' width='64' height='128' rx='16' fill='%2310b981'/><rect x='96' y='224' width='36' height='64' fill='%2310b981'/><rect x='380' y='224' width='36' height='64' fill='%2310b981'/><rect x='132' y='236' width='248' height='40' rx='20' fill='%2310b981'/><\u002Fsvg>\",\n        sizes: \"512x512\",\n        type: \"image/svg+xml\",\n        purpose: \"any maskable\"\n      }\n    ]\n  };\n  const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });\n  const url = URL.createObjectURL(blob);\n  const link = document.createElement('link');\n  link.rel = 'manifest';\n  link.href = url;\n  document.head.appendChild(link);\n}\n\n// Tentative d'enregistrement d'un Service Worker via Blob URL.\n// Note importante : sur iOS Safari, cela ne fonctionne pas de manière fiable.\n// L'app reste néanmoins installable et fonctionnelle hors-ligne grâce à\n// IndexedDB et au fait que tous les assets sont inclus dans ce fichier unique.\n// Pour un vrai SW persistant, héberger le fichier sur un serveur HTTPS\n// (GitHub Pages, Netlify, Vercel) avec un sw.js séparé.\nfunction tenterEnregistrerSW() {\n  if (!('serviceWorker' in navigator)) return;\n\n  const swCode = `\n    const CACHE = 'muscu-cache-v1';\n    self.addEventListener('install', e => self.skipWaiting());\n    self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));\n    self.addEventListener('fetch', e => {\n      // Cache-first basique pour la page courante (le fichier unique)\n      e.respondWith(\n        caches.match(e.request).then(r => r || fetch(e.request).then(resp => {\n          if (resp.ok && e.request.method === 'GET') {\n            const clone = resp.clone();\n            caches.open(CACHE).then(c => c.put(e.request, clone));\n          }\n          return resp;\n        }).catch(() => caches.match('/')))\n      );\n    });\n  `;\n  try {\n    const blob = new Blob([swCode], { type: 'application/javascript' });\n    const url = URL.createObjectURL(blob);\n    navigator.serviceWorker.register(url).catch(err => {\n      // Échec silencieux : pas bloquant pour l'app\n      console.log('SW non enregistré (normal si fichier local) :', err.message);\n    });\n  } catch (err) {\n    console.log('Enregistrement SW impossible :', err.message);\n  }\n}\n\n/* ============================================================================\n   SECTION 21 : POINT D'ENTRÉE - INIT DE L'APPLICATION\n   ============================================================================ */\n\n(async function init() {\n  try {\n    installerManifestPWA();\n    tenterEnregistrerSW();\n    await openDB();\n    await initialiserSiVide();\n    await rafraichir();\n  } catch (err) {\n    document.getElementById('app').innerHTML = `\n      <div class=\"card\" style=\"border-left: 4px solid var(--danger);\">\n        <h3>Erreur d'initialisation<\u002Fh3>\n        <p>${escapeHtml(err.message)}<\u002Fp>\n        <p class=\"text-muted\">Vérifiez que votre navigateur autorise IndexedDB.<\u002Fp>\n      <\u002Fdiv>\n    `;\n  }\n})();\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
