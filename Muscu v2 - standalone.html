// Toggle thème clair/sombre, persisté dans localStorage\nfunction toggleTheme() {\n  const root = document.documentElement;\n  const isLight = root.classList.toggle('light');\n  try { localStorage.setItem('muscu-theme', isLight ? 'light' : 'dark'); } catch (e) {}\n  // Met à jour la theme-color meta (statusbar iOS PWA)\n  const meta = document.querySelector('meta[name=\"theme-color\"]');\n  if (meta) meta.setAttribute('content', isLight ? '#F2F2F7' : getComputedStyle(document.documentElement).getPropertyValue('--bg').trim());\n}\n\nfunction themeToggleBtn() {\n  const isLight = document.documentElement.classList.contains('light');\n  return `<button class=\"icon-btn\" data-action=\"toggle-theme\" title=\"Changer de thème\" aria-label=\"Thème\">\n    ${isLight ? ICONS.moon : ICONS.sun}\n  <\u002Fbutton>`;\n}\n\n// Animation de victoire à l'enregistrement\nfunction jouerAnimationVictoire(stats) {\n  const root = document.getElementById('toast-root');\n  const overlay = document.createElement('div');\n  overlay.className = 'save-overlay';\n  const streakValue = stats.streak || calculerStreak();\n  const onos = ['DOGOOO', 'KRAKAAA', 'GOOOON', 'BAMMM', 'ZUDOOOON', 'GIGIGIGI', 'GOOOAAH', 'BWAAAH'];\n  const pick = () => onos[Math.floor(Math.random() * onos.length)];\n  const o1 = pick(), o2 = pick(), o3 = pick();\n  overlay.innerHTML = `\n    <div class=\"speed-lines\"><\u002Fdiv>\n    <div class=\"scan\"><\u002Fdiv>\n    <div class=\"ono ono-1\">${o1}<\u002Fdiv>\n    <div class=\"ono ono-2\">${o2}<\u002Fdiv>\n    <div class=\"ono ono-3\">${o3}<\u002Fdiv>\n    <div class=\"save-overlay-msg\">&gt;&gt; SÉANCE ENREGISTRÉE<\u002Fdiv>\n    <div class=\"save-overlay-title\">C'EST PLIÉ<\u002Fdiv>\n    <div class=\"save-overlay-stats\">\n      <div class=\"save-overlay-stat\">Série<span class=\"v\">${streakValue}sem<\u002Fspan><\u002Fdiv>\n      <div class=\"save-overlay-stat\">PR<span class=\"v magenta\">×${stats.prCount || 0}<\u002Fspan><\u002Fdiv>\n      <div class=\"save-overlay-stat\">Volume<span class=\"v cyan\">${stats.volume || 0}kg<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  `;\n  root.appendChild(overlay);\n  // Screen shake\n  const app = document.getElementById('app');\n  app.classList.add('shake');\n  setTimeout(() => app.classList.remove('shake'), 500);\n  setTimeout(() => overlay.remove(), 2500);\n}\n\n/* ============================================================================\n   SECTION 5.6 : IMAGE SLOTS (persistance localStorage de data URLs)\n   ============================================================================ */\n\nconst SLOT_PREFIX = 'muscu-slot-';\n\nfunction chargerSlotImage(slotId) {\n  try { return localStorage.getItem(SLOT_PREFIX + slotId) || null; }\n  catch (e) { return null; }\n}\n\nfunction sauvegarderSlotImage(slotId, dataURL) {\n  try { localStorage.setItem(SLOT_PREFIX + slotId, dataURL); }\n  catch (e) { toast('Image trop lourde pour le stockage'); }\n}\n\nfunction effacerSlotImage(slotId) {\n  try { localStorage.removeItem(SLOT_PREFIX + slotId); } catch (e) {}\n}\n\n// Compresse une image (max 1200px largeur) en data URL JPEG\nfunction compresserImage(file, maxW = 1200, quality = 0.82) {\n  return new Promise((resolve, reject) => {\n    const reader = new FileReader();\n    reader.onload = e => {\n      const img = new Image();\n      img.onload = () => {\n        const ratio = img.width > maxW ? maxW / img.width : 1;\n        const w = Math.round(img.width * ratio);\n        const h = Math.round(img.height * ratio);\n        const canvas = document.createElement('canvas');\n        canvas.width = w; canvas.height = h;\n        const ctx = canvas.getContext('2d');\n        ctx.drawImage(img, 0, 0, w, h);\n        resolve(canvas.toDataURL('image/jpeg', quality));\n      };\n      img.onerror = reject;\n      img.src = e.target.result;\n    };\n    reader.onerror = reject;\n    reader.readAsDataURL(file);\n  });\n}\n\n// Applique au DOM les images des slots présents dans la vue actuelle\nfunction hydraterSlotsImages() {\n  document.querySelectorAll('.image-slot').forEach(slot => {\n    const id = slot.dataset.slotId;\n    const img = chargerSlotImage(id);\n    if (img) {\n      slot.style.backgroundImage = `url(\"${img}\")`;\n      slot.classList.add('has-image');\n      // Bouton effacer (créé s'il n'existe pas)\n      if (!slot.querySelector('.slot-clear')) {\n        const btn = document.createElement('button');\n        btn.className = 'slot-clear';\n        btn.textContent = '✕';\n        btn.dataset.action = 'clear-slot';\n        btn.dataset.slotId = id;\n        slot.appendChild(btn);\n      }\n    } else {\n      slot.style.backgroundImage = '';\n      slot.classList.remove('has-image');\n    }\n  });\n}\n\n// Ouvre le picker fichier pour un slot et persiste l'image choisie\nasync function ouvrirPickerSlot(slotId) {\n  const input = document.createElement('input');\n  input.type = 'file';\n  input.accept = 'image/*';\n  input.onchange = async () => {\n    const file = input.files[0];\n    if (!file) return;\n    try {\n      const dataURL = await compresserImage(file);\n      sauvegarderSlotImage(slotId, dataURL);\n      hydraterSlotsImages();\n      toast('Image enregistrée');\n    } catch (e) {\n      toast('Erreur lors du chargement de l\\'image');\n    }\n  };\n  input.click();\n}\n\n// Drag & drop pour les slots\nfunction activerDragDropSlots() {\n  document.querySelectorAll('.image-slot').forEach(slot => {\n    slot.addEventListener('dragover', e => {\n      e.preventDefault();\n      slot.classList.add('dragover');\n    });\n    slot.addEventListener('dragleave', () => slot.classList.remove('dragover'));\n    slot.addEventListener('drop', async e => {\n      e.preventDefault();\n      slot.classList.remove('dragover');\n      const file = e.dataTransfer.files[0];\n      if (!file || !file.type.startsWith('image/')) return;\n      try {\n        const dataURL = await compresserImage(file);\n        sauvegarderSlotImage(slot.dataset.slotId, dataURL);\n        hydraterSlotsImages();\n        toast('Image enregistrée');\n      } catch (err) { toast('Erreur lors du chargement'); }\n    });\n  });\n}\n\n/* ============================================================================\n   SECTION 6 : COMPOSANTS UI - TOASTS ET MODALES\n   ============================================================================ */\n\nfunction toast(message, duree = 2500) {\n  const root = document.getElementById('toast-root');\n  const el = document.createElement('div');\n  el.className = 'toast';\n  el.textContent = message;\n  root.appendChild(el);\n  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; }, duree - 300);\n  setTimeout(() => el.remove(), duree);\n}\n\n// Affiche une modale ; retourne une promesse résolue à la fermeture\nfunction modal(contenuHTML, options = {}) {\n  return new Promise(resolve => {\n    const root = document.getElementById('modal-root');\n    const overlay = document.createElement('div');\n    overlay.className = 'modal-overlay';\n    overlay.innerHTML = `<div class=\"modal\">${contenuHTML}<\u002Fdiv>`;\n    root.appendChild(overlay);\n\n    // Fonction de fermeture\n    overlay.fermer = (result) => {\n      overlay.remove();\n      resolve(result);\n    };\n\n    // Fermer en cliquant à l'extérieur si autorisé\n    if (options.dismissible !== false) {\n      overlay.addEventListener('click', (e) => {\n        if (e.target === overlay) overlay.fermer(null);\n      });\n    }\n  });\n}\n\n// Modale de confirmation simple (oui/non)\nasync function confirmer(message, libelleConfirmation = 'Confirmer') {\n  return new Promise(resolve => {\n    modal(`\n      <p style=\"margin: 0 0 16px;\">${message}<\u002Fp>\n      <div class=\"modal-actions\">\n        <button class=\"btn-secondary\" data-action=\"non\">Annuler<\u002Fbutton>\n        <button class=\"btn-danger\" data-action=\"oui\">${libelleConfirmation}<\u002Fbutton>\n      <\u002Fdiv>\n    `);\n    setTimeout(() => {\n      const overlay = document.querySelector('.modal-overlay:last-child');\n      overlay.querySelectorAll('button').forEach(b => {\n        b.addEventListener('click', () => {\n          overlay.fermer(b.dataset.action === 'oui');\n          resolve(b.dataset.action === 'oui');\n        });\n      });\n    }, 0);\n  });\n}\n\n/* ============================================================================\n   SECTION 7 : VUE 1 - ACCUEIL\n   ============================================================================ */\n\nfunction vueAccueil() {\n  const semaine = State.etat.semaineCourante;\n  const faites = State.etat.seancesFaitesCetteSemaine;\n  const aucunExercice = State.exercices.filter(e => !e.archive).length === 0;\n  const streak = calculerStreak();\n  const totalSeances = State.seances.length || 4;\n  const colors = SEANCE_COLORS;\n\n  // Planning de la semaine en cours\n  const auj = new Date();\n  const lundi = lundiDe(auj);\n  const lundiIso = isoLocal(lundi);\n  const plan = getPlanning(lundiIso);\n  const jAuj = jourIndex(auj);\n  const planVide = Object.keys(plan).length === 0;\n\n  const cellulesSemaine = JOURS.map((j, idx) => {\n    const date = ajouterJours(lundi, idx);\n    const dots = State.seances\n      .map((s, i) => plan[s.id] === idx\n        ? `<span class=\"wk-dot ${faites.includes(s.id) ? 'done' : ''}\" style=\"--c: ${colors[i % colors.length]};\" title=\"${escapeHtml(s.nom)}\"><\u002Fspan>`\n        : '')\n      .join('');\n    return `<div class=\"wk-cell ${idx === jAuj ? 'today' : ''} ${idx < jAuj ? 'past' : ''}\">\n        <span class=\"wk-day\">${j}<\u002Fspan>\n        <span class=\"wk-date\">${date.getDate()}<\u002Fspan>\n        <span class=\"wk-dots\">${dots}<\u002Fspan>\n      <\u002Fdiv>`;\n  }).join('');\n\n  const lundiProchainIso = isoLocal(ajouterJours(lundi, 7));\n  const rappelDimanche = jAuj === 6 && Object.keys(getPlanning(lundiProchainIso)).length === 0 && State.seances.length > 0\n    ? `<div class=\"plan-prompt\" data-action=\"ouvrir-planning\" data-lundi=\"${lundiProchainIso}\">\n         <div>\n           <div class=\"uplabel\" style=\"color: var(--lime);\">// C'EST DIMANCHE<\u002Fdiv>\n           <div class=\"plan-prompt-title\">Programme ta semaine<\u002Fdiv>\n           <div class=\"mono\" style=\"color: var(--muted); font-size: 0.72rem;\">${libelleSemaine(ajouterJours(lundi, 7))}<\u002Fdiv>\n         <\u002Fdiv>\n         <span class=\"run-btn\">PLANIFIER ${ICONS.arrow}<\u002Fspan>\n       <\u002Fdiv>`\n    : '';\n\n  const blocSemaine = State.seances.length === 0 ? '' : `\n    <div class=\"wk-strip\">\n      <div class=\"flex-between\" style=\"margin-bottom: 10px;\">\n        <span class=\"uplabel\">// PLANNING ${libelleSemaine(lundi).toUpperCase()}<\u002Fspan>\n        <button class=\"btn-small btn-secondary\" data-action=\"ouvrir-planning\" data-lundi=\"${lundiIso}\">${planVide ? 'PLANIFIER' : 'MODIFIER'}<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"wk-grid\">${cellulesSemaine}<\u002Fdiv>\n      ${planVide ? `<div class=\"mono\" style=\"color: var(--muted); font-size: 0.72rem; margin-top: 8px;\">Aucune séance planifiée cette semaine.<\u002Fdiv>` : ''}\n    <\u002Fdiv>`;\n\n  const cardsSeances = State.seances.map((s, i) => {\n    const exos = s.exercicesIds\n      .map(id => State.exercices.find(e => e.id === id))\n      .filter(Boolean);\n    const fait = faites.includes(s.id);\n    const stripe = colors[i % colors.length];\n\n    const exosHTML = exos.length > 0\n      ? exos.slice(0, 6).map(e => `\n          <span class=\"exercise-tag\">\n            <span class=\"exercise-emoji\">${GROUPES[e.groupeMusculaire].emoji}<\u002Fspan>${escapeHtml(e.nom)}\n          <\u002Fspan>`).join('') +\n        (exos.length > 6 ? `<span class=\"exercise-tag\" style=\"color:var(--faint)\">+${exos.length - 6}<\u002Fspan>` : '')\n      : '<span class=\"text-muted mono\" style=\"font-size:0.78rem\">aucun exo // configurer →<\u002Fspan>';\n\n    return `\n      <div class=\"card card-tappable card-stripe ${fait ? 'card-done' : ''}\" data-action=\"ouvrir-seance\" data-id=\"${s.id}\" style=\"--stripe: ${fait ? 'var(--faint)' : stripe};\">\n        <div class=\"seance-head\">\n          <div class=\"seance-title-row\">\n            <span class=\"seance-index\">${String(i + 1).padStart(2, '0')}//<\u002Fspan>\n            <span class=\"seance-name\">${escapeHtml(s.nom)}<\u002Fspan>\n          <\u002Fdiv>\n          ${fait\n            ? `<span class=\"done-tag\">[FAIT]<\u002Fspan>`\n            : `<button class=\"run-btn\" data-action=\"ouvrir-seance\" data-id=\"${s.id}\">GO ${ICONS.arrow}<\u002Fbutton>`}\n        <\u002Fdiv>\n        ${plan[s.id] !== undefined ? `<div class=\"seance-day ${plan[s.id] === jAuj && !fait ? 'today' : ''}\">${plan[s.id] === jAuj ? \"AUJOURD'HUI\" : JOURS_LONGS[plan[s.id]].toUpperCase() + ' ' + ajouterJours(lundi, plan[s.id]).getDate()}<\u002Fdiv>` : ''}\n        <div class=\"tag-row\">${exosHTML}<\u002Fdiv>\n      <\u002Fdiv>\n    `;\n  }).join('');\n\n  const messageBienvenue = aucunExercice ? `\n    <div class=\"card\" style=\"border-color: var(--lime); border-left: 3px solid var(--lime);\">\n      <div class=\"uplabel\" style=\"margin-bottom: 6px;\">// PREMIER DÉMARRAGE<\u002Fdiv>\n      <div style=\"font-weight: 600;\">Commence par ajouter tes exercices dans <strong style=\"color: var(--lime);\">Paramétrage<\u002Fstrong>.<\u002Fdiv>\n    <\u002Fdiv>\n  ` : '';\n\n  // LED row : afficher jusqu'à 14 semaines max d'historique\n  const ledTotal = 14;\n  const ledRow = Array.from({ length: ledTotal }).map((_, i) => {\n    // Les \"streak\" plus récentes s'affichent à droite\n    const on = i >= (ledTotal - streak);\n    return `<div class=\"led ${on ? 'on' : ''}\"><\u002Fdiv>`;\n  }).join('');\n\n  return `\n    <div class=\"header\">\n      <div class=\"flex gap-8\" style=\"align-items: center;\">\n        <div class=\"logo\">M<\u002Fdiv>\n        <div>\n          <div class=\"uplabel\">BLOC // ${String(semaine).padStart(2,'0')}<\u002Fdiv>\n          <h1 style=\"font-size: 1.25rem; margin-top: 2px;\">SEM_${String(semaine).padStart(2,'0')}<\u002Fh1>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      ${themeToggleBtn()}\n    <\u002Fdiv>\n\n    <!-- Streak hero -->\n    <div class=\"streak-hero\">\n      <div class=\"streak-hero-row\">\n        <div>\n          <div class=\"uplabel\" style=\"margin-bottom: 4px;\">SÉRIE // ACTIVE<\u002Fdiv>\n          <div style=\"display: flex; align-items: baseline; gap: 4px;\">\n            <span class=\"streak-value tabular\">${streak}<\u002Fspan>\n            <span class=\"streak-unit italic\">sem<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <span class=\"badge\">${faites.length}/${totalSeances} // SEM<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"led-row\">${ledRow}<\u002Fdiv>\n    <\u002Fdiv>\n\n    ${rappelDimanche}\n    ${blocSemaine}\n\n    ${messageBienvenue}\n\n    <!-- Séances -->\n    <div class=\"section-head\">\n      <span class=\"uplabel\">// SÉANCES<\u002Fspan>\n      <span class=\"mono\" style=\"color: var(--muted); font-size: 0.7rem;\">${(totalSeances - faites.length)} restantes<\u002Fspan>\n    <\u002Fdiv>\n\n    ${cardsSeances}\n\n    <button class=\"btn-secondary\" data-action=\"passer-semaine\" style=\"width: 100%; margin-top: 14px;\">\n      ${ICONS.arrow}  PASSER À LA SEMAINE ${semaine + 1}\n    <\u002Fbutton>\n  `;\n}\n\n/* ============================================================================\n   SECTION 8 : VUE 2 - SESSION (séance en cours)\n   ============================================================================ */\n\nfunction vueSession() {\n  const seance = State.seances.find(s => s.id === State.vueParams.seanceId);\n  if (!seance) {\n    naviguer('accueil');\n    return '';\n  }\n\n  const exos = seance.exercicesIds\n    .map(id => State.exercices.find(e => e.id === id && !e.archive))\n    .filter(Boolean);\n\n  if (exos.length === 0) {\n    return `\n      <div class=\"header\">\n        <button class=\"icon-btn\" data-action=\"retour-accueil\" aria-label=\"Retour\">${ICONS.back}<\u002Fbutton>\n        <div class=\"header-titlewrap\">\n          <div class=\"uplabel\">SEM_${String(State.etat.semaineCourante).padStart(2,'0')} // SÉANCE<\u002Fdiv>\n          <h1 style=\"font-size: 1.4rem;\">${escapeHtml(seance.nom)}<span class=\"text-lime\">_<\u002Fspan><\u002Fh1>\n        <\u002Fdiv>\n        ${themeToggleBtn()}\n      <\u002Fdiv>\n      <div class=\"empty-state\">\n        <div class=\"uplabel\" style=\"margin-bottom: 14px;\">// AUCUN EXO LIÉ<\u002Fdiv>\n        <p style=\"margin-bottom: 18px;\">Cette séance n'a pas encore d'exercices configurés.<\u002Fp>\n        <button data-action=\"aller-parametrage\">Configurer la séance ${ICONS.arrow}<\u002Fbutton>\n      <\u002Fdiv>\n    `;\n  }\n\n  // Calcul progression : on regarde combien d'exercices ont déjà été saisis\n  // (heuristique simple : la barre est à 0% au début, à 100% à l'enregistrement)\n  const progress = 0;\n\n  // Brouillon de la séance en cours (saisies non encore enregistrées)\n  const brouillon = chargerBrouillon(seance.id);\n\n  const cardsExos = exos.map((e, idx) => {\n    const valeurs = valeursPreRemplies(e);\n    // Si un brouillon existe pour cet exo, il prime sur les valeurs pré-remplies\n    const draftExo = brouillon && brouillon.exos ? brouillon.exos[e.id] : null;\n    const histo = histoExercice(e.id, 8);\n    const histoPoids = histo.map(p => p.poids);\n    const groupe = GROUPES[e.groupeMusculaire];\n    const repsPrevues = e.repsPrevues || 10;\n    const series = e.series || 4;\n    const derniere = histo[histo.length - 1];\n    const pr = estPRActuel(e.id);\n    const meilleur = meilleurPR(e.id);\n\n    const rappel = derniere\n      ? `<span class=\"mono\">dern:<\u002Fspan> ${derniere.poids}kg/${derniere.repsSerie4}r`\n      : `<span class=\"mono\">aucune donnée<\u002Fspan>`;\n\n    // Dernière augmentation de poids (s'il y en a une dans l'historique)\n    const augmentation = derniereAugmentationPoids(e.id);\n    const blocAugmentation = augmentation\n      ? `<div class=\"last-bump\">\n           <span class=\"last-bump-arrow\">↑<\u002Fspan>\n           <span class=\"last-bump-text\">\n             <span class=\"mono uplabel\" style=\"color: var(--lime); font-size: 0.6rem;\">+${augmentation.delta}kg<\u002Fspan>\n             <span class=\"mono\" style=\"color: var(--muted); font-size: 0.72rem;\">\n               · sem ${String(augmentation.semaine).padStart(2,'0')} · ${formatDateCourte(augmentation.dateISO)}\n               · ${augmentation.ancienPoids} → ${augmentation.nouveauPoids}kg\n             <\u002Fspan>\n           <\u002Fspan>\n         <\u002Fdiv>`\n      : '';\n\n    const blocAnciennesNotes = valeurs.anciennesNotes && valeurs.anciennesNotes.trim()\n      ? `<div class=\"notes-precedentes\">\n           <div class=\"notes-precedentes-label\">&gt;&gt; notes_précédentes<\u002Fdiv>\n           <div class=\"notes-precedentes-content\">${escapeHtml(valeurs.anciennesNotes)}<\u002Fdiv>\n         <\u002Fdiv>`\n      : '';\n\n    const sparkW = 72, sparkH = 24;\n    const sparkColor = pr ? 'var(--magenta)' : 'var(--lime)';\n\n    // Compute 1RM live (utilise la dernière saisie pré-remplie)\n    const poidsAffiche = draftExo && draftExo.poids !== '' && draftExo.poids != null ? draftExo.poids : valeurs.poids;\n    const repsAffiche = draftExo && draftExo.reps !== '' && draftExo.reps != null ? draftExo.reps : valeurs.reps;\n    const notesAffiche = draftExo && draftExo.notes != null ? draftExo.notes : '';\n    const oneRM = epley1RM(parseFloat(poidsAffiche) || 0, parseInt(repsAffiche) || 0);\n    const ribbon = pr && meilleur\n      ? `<div class=\"pr-ribbon\">${ICONS.trophy}<span>RECORD // Sem ${meilleur.semaine} · ${meilleur.poids}kg × ${meilleur.reps}r → 1RM est. ${meilleur.oneRM}kg<\u002Fspan><\u002Fdiv>`\n      : '';\n\n    return `\n      <div class=\"exo-block ${pr ? 'is-pr' : ''}\" data-exercice-id=\"${e.id}\">\n        <div class=\"exo-head\">\n          <div class=\"exo-head-left\">\n            <div class=\"exo-emoji-tile\">${groupe.emoji}<\u002Fdiv>\n            <div style=\"min-width: 0;\">\n              <div class=\"exo-name\">${escapeHtml(e.nom)}<\u002Fdiv>\n              <div class=\"exo-meta\">[${series}×${repsPrevues}] · ${rappel}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          ${pr ? `<div class=\"pr-badge\">${ICONS.trophy}NOUVEAU PR<\u002Fdiv>` : ''}\n        <\u002Fdiv>\n\n        ${blocAugmentation}\n\n        <div class=\"input-group\">\n          <div class=\"big-input ${pr ? 'is-pr' : ''}\">\n            <span class=\"uplabel\">POIDS_KG<\u002Fspan>\n            <div class=\"big-input-value\">\n              <input type=\"number\" step=\"1\" min=\"0\" inputmode=\"decimal\"\n                     data-champ=\"poids\" data-exo=\"${e.id}\" value=\"${poidsAffiche}\">\n            <\u002Fdiv>\n            <div class=\"big-input-controls\">\n              <button class=\"minus\" data-action=\"adjust\" data-exo=\"${e.id}\" data-champ=\"poids\" data-delta=\"-1\" type=\"button\">−<\u002Fbutton>\n              <button class=\"plus\" data-action=\"adjust\" data-exo=\"${e.id}\" data-champ=\"poids\" data-delta=\"1\" type=\"button\">+<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"big-input ${pr ? 'is-pr' : ''}\">\n            <span class=\"uplabel\">REPS_S${series}<\u002Fspan>\n            <div class=\"big-input-value\">\n              <input type=\"number\" step=\"1\" min=\"0\" inputmode=\"numeric\"\n                     data-champ=\"reps\" data-exo=\"${e.id}\" value=\"${repsAffiche}\">\n            <\u002Fdiv>\n            <div class=\"big-input-controls\">\n              <button class=\"minus\" data-action=\"adjust\" data-exo=\"${e.id}\" data-champ=\"reps\" data-delta=\"-1\" type=\"button\">−<\u002Fbutton>\n              <button class=\"plus\" data-action=\"adjust\" data-exo=\"${e.id}\" data-champ=\"reps\" data-delta=\"1\" type=\"button\">+<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        ${ribbon}\n\n        <div class=\"trend-row\">\n          <div class=\"trend-left\">\n            <span class=\"uplabel\">TENDANCE.8S<\u002Fspan>\n            ${histoPoids.length >= 2\n              ? sparklineSVG(histoPoids, { w: sparkW, h: sparkH, color: sparkColor, glow: true })\n              : `<span class=\"text-muted mono\" style=\"font-size: 0.7rem;\">— pas encore de tendance<\u002Fspan>`}\n          <\u002Fdiv>\n          <div class=\"trend-right\">\n            <div class=\"uplabel\">EST_1RM<\u002Fdiv>\n            <div class=\"trend-value ${pr ? 'trend-value-magenta' : 'text-lime'}\">${oneRM}<span style=\"color: var(--muted); font-size: 0.7rem; margin-left: 2px;\">kg<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        ${blocAnciennesNotes}\n\n        <label>Notes // session<\u002Flabel>\n        <textarea data-champ=\"notes\" data-exo=\"${e.id}\" rows=\"2\" placeholder=\"Ressenti, ajustements, technique…\">${escapeHtml(notesAffiche)}<\u002Ftextarea>\n      <\u002Fdiv>\n    `;\n  }).join('');\n\n  // Bloc d'affichage du dernier commentaire global de cette séance\n  const dernierCom = dernierCommentaireDeSeance(seance.id);\n  const blocCommentairePrecedent = dernierCom\n    ? `<div class=\"notes-precedentes\" style=\"margin-bottom: 12px;\">\n         <div class=\"notes-precedentes-label\">&gt;&gt; sem_${String(dernierCom.semaine).padStart(2,'0')} // commentaire séance<\u002Fdiv>\n         <div class=\"notes-precedentes-content\">${escapeHtml(dernierCom.texte)}<\u002Fdiv>\n       <\u002Fdiv>`\n    : '';\n\n  const seanceIndex = State.seances.findIndex(s => s.id === seance.id) + 1;\n\n  // Bandeau \"brouillon en cours\" si des saisies ont déjà été capturées\n  const blocBrouillon = brouillon && brouillon.maj\n    ? `<div class=\"draft-banner\">\n         <span class=\"draft-dot\"><\u002Fspan>\n         <span class=\"mono\">Séance en cours — saisies sauvegardées automatiquement (${formatHeure(brouillon.maj)})<\u002Fspan>\n       <\u002Fdiv>`\n    : '';\n\n  return `\n    <div class=\"header\">\n      <button class=\"icon-btn\" data-action=\"retour-accueil\" aria-label=\"Retour\">${ICONS.back}<\u002Fbutton>\n      <div class=\"header-titlewrap\">\n        <div class=\"uplabel\">SEM_${String(State.etat.semaineCourante).padStart(2,'0')} // SÉANCE_${String(seanceIndex).padStart(2,'0')}<\u002Fdiv>\n        <h1 style=\"font-size: 1.55rem;\">${escapeHtml(seance.nom)}<span class=\"text-lime\">_<\u002Fspan><\u002Fh1>\n      <\u002Fdiv>\n      ${themeToggleBtn()}\n    <\u002Fdiv>\n\n    <div class=\"session-progress\">\n      <div class=\"session-progress-fill\" style=\"width: ${progress}%\"><\u002Fdiv>\n    <\u002Fdiv>\n\n    ${blocBrouillon}\n\n    <!-- Compteur visuel : un check par exo -->\n    <div class=\"timer-bar\">\n      <div>\n        <div class=\"uplabel\">EXOS<\u002Fdiv>\n        <div class=\"timer-value tabular\">${exos.length}<span class=\"sec\">/${exos.length}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"timer-checks\">\n        ${exos.map((_, i) => `<div class=\"timer-check\">${i + 1}<\u002Fdiv>`).join('')}\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    ${cardsExos}\n\n    <div class=\"card\">\n      ${blocCommentairePrecedent}\n      <label style=\"margin-top: 0;\">Commentaire séance<\u002Flabel>\n      <textarea id=\"commentaire-seance\" rows=\"3\" placeholder=\"Comment t'es-tu senti·e ? Sommeil, énergie, notes générales…\">${brouillon && brouillon.commentaire ? escapeHtml(brouillon.commentaire) : ''}<\u002Ftextarea>\n    <\u002Fdiv>\n\n    <button data-action=\"enregistrer-seance\" style=\"width: 100%; padding: 20px; font-size: 1.05rem;\">\n      ENREGISTRER LA SÉANCE  ${ICONS.arrow}\n    <\u002Fbutton>\n  `;\n}\n\n/* ============================================================================\n   SECTION 9 : VUE 3 - PARAMÉTRAGE\n   ============================================================================ */\n\n/* ----------------------------------------------------------------------------\n   APPARENCE : 3 variantes + adoucissement des libellés techniques\n---------------------------------------------------------------------------- */\nconst VARIANTES = [\n  { id: 'graphite', nom: 'Graphite', bg: '#000000', surface: '#1C1C1E', sw: ['#30D158', '#FF4D6D', '#64D2FF'], font: '-apple-system, BlinkMacSystemFont, sans-serif' },\n  { id: 'ardoise', nom: 'Ardoise', bg: '#0E1015', surface: '#171A21', sw: ['#8B98FF', '#FF8FAB', '#5ED3C7'], font: 'Outfit, sans-serif' },\n  { id: 'braise', nom: 'Braise', bg: '#110F0E', surface: '#1C1917', sw: ['#FF9F5A', '#FF6B6B', '#7FD1B9'], font: 'Nunito, sans-serif' }\n];\n\nfunction appliquerVariante(v) {\n  document.documentElement.dataset.variant = v;\n  try { localStorage.setItem('muscu-variant', v); } catch (e) {}\n  const meta = document.querySelector('meta[name=\"theme-color\"]');\n  const def = VARIANTES.find(x => x.id === v);\n  if (meta && def && !document.documentElement.classList.contains('light')) meta.setAttribute('content', def.bg);\n}\n\nfunction blocApparence() {\n  const actuelle = document.documentElement.dataset.variant || 'graphite';\n  return `\n    <div class=\"card\">\n      <div class=\"uplabel\">Apparence<\u002Fdiv>\n      <div class=\"variant-grid\">\n        ${VARIANTES.map(v => `\n          <button class=\"variant-opt ${v.id === actuelle ? 'active' : ''}\" data-action=\"variante\" data-v=\"${v.id}\" type=\"button\">\n            <span class=\"variant-preview\" style=\"background:${v.bg};\">\n              <span class=\"variant-sw\">${v.sw.map(c => `<span style=\"background:${c}\"><\u002Fspan>`).join('')}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"font-family:${v.font};\">${v.nom}<\u002Fspan>\n          <\u002Fbutton>`).join('')}\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n}\n\nconst SOFT_EXACT = {\n  'GO': 'Démarrer', 'MOD': 'Modifier', 'ARCH': 'Archiver', '[FAIT]': 'Fait ✓',\n  'POIDS_KG': 'Poids (kg)', 'EST_1RM': '1RM estimé', 'TENDANCE.8S': 'Tendance 8 sem.',\n  'SÉRIE // ACTIVE': 'Série en cours', 'NOUVEAU PR': 'Nouveau PR', 'PR': 'PR',\n  '>> SÉANCE ENREGISTRÉE': 'Séance enregistrée'\n};\nconst SOFT_SKIP = '.seance-name, .exo-name, .exercise-row .name, .exercise-tag, .recap-seance-name, td, textarea, input, select, option, script, style, .notes-precedentes-content, .toast';\n\nfunction adoucirTexte(raw) {\n  const lead = raw.match(/^\\s*/)[0], trail = raw.match(/\\s*$/)[0];\n  let s = raw.trim();\n  if (!s) return raw;\n  if (SOFT_EXACT[s]) return lead + SOFT_EXACT[s] + trail;\n  s = s.replace(/^REPS_S(\\d+)$/, 'Reps série $1')\n       .replace(/POIDS\\.kg \\/\\/ (\\d+)_PTS/, 'Poids (kg) · $1 séances')\n       .replace(/^(\\d+)\\/(\\d+) \\/\\/ SEM$/, '$1/$2 cette semaine')\n       .replace(/\\bSEM_(\\d+)/g, (m, n) => 'SEMAINE ' + parseInt(n, 10))\n       .replace(/SÉANCE_(\\d+)/g, (m, n) => 'SÉANCE ' + parseInt(n, 10))\n       .replace(/^BLOC \\/\\/ (\\d+)$/, (m, n) => 'BLOC ' + parseInt(n, 10))\n       .replace(/\\[(\\d+)\\]/g, '($1)')\n       .replace(/^(\\d+)\\s*\\/\\/$/, '$1')\n       .replace(/\\s\\/\\/\\s/g, ' · ')\n       .replace(/^\\[([^\\]]+)\\]/, '$1');\n  if (/[a-zà-ÿ]/.test(s) || !/[A-ZÀ-Ý]{2}/.test(s)) return lead + s + trail;\n  s = s.replace(/^\\s*(\\/\\/|>>)\\s*/, '').replace(/\\s*\\/\\/\\s*/g, ' · ').replace(/_/g, ' ').replace(/[\\[\\]]/g, '')\n       .replace(/(\\s*·\\s*)+$/, '').replace(/^(\\s*·\\s*)+/, '').replace(/\\s{2,}/g, ' ');\n  s = s.toLocaleLowerCase('fr').replace(/[a-zà-ÿ]/, c => c.toLocaleUpperCase('fr'));\n  s = s.replace(/\\bpr\\b/g, 'PR').replace(/\\b1rm\\b/g, '1RM').replace(/\\bjson\\b/g, 'JSON').replace(/· séance/g, '· Séance');\n  return lead + s + trail;\n}\n\nfunction adoucirLibelles(racine) {\n  const walker = document.createTreeWalker(racine, NodeFilter.SHOW_TEXT);\n  let n;\n  while ((n = walker.nextNode())) {\n    const p = n.parentElement;\n    if (!p || p.closest(SOFT_SKIP)) continue;\n    const t = adoucirTexte(n.nodeValue);\n    if (t !== n.nodeValue) n.nodeValue = t;\n  }\n}\n\n(function observerLibelles() {\n  let planifie = false;\n  const run = () => { planifie = false; adoucirLibelles(document.body); };\n  const obs = new MutationObserver(() => { if (!planifie) { planifie = true; setTimeout(run, 0); } });\n  const start = () => { obs.observe(document.body, { childList: true, subtree: true }); run(); };\n  if (document.body) start(); else document.addEventListener('DOMContentLoaded', start);\n})();\n\nfunction vueParametrage() {\n  const onglet = State.ongletParam;\n  return `\n    <div class=\"header\">\n      <button class=\"icon-btn\" data-action=\"retour-accueil\" aria-label=\"Retour\">${ICONS.back}<\u002Fbutton>\n      <div class=\"header-titlewrap\">\n        <div class=\"uplabel\">CONFIG // RÉGLAGES<\u002Fdiv>\n        <h1 style=\"font-size: 1.55rem;\">PARAMÉTRAGE<span class=\"text-lime\">_<\u002Fspan><\u002Fh1>\n      <\u002Fdiv>\n      ${themeToggleBtn()}\n    <\u002Fdiv>\n    ${blocApparence()}\n    <div class=\"tabs\">\n      <button class=\"tab ${onglet === 'catalogue' ? 'active' : ''}\" data-action=\"onglet\" data-onglet=\"catalogue\">\n        Catalogue\n      <\u002Fbutton>\n      <button class=\"tab ${onglet === 'composition' ? 'active' : ''}\" data-action=\"onglet\" data-onglet=\"composition\">\n        Séances\n      <\u002Fbutton>\n    <\u002Fdiv>\n    ${onglet === 'catalogue' ? vueOngletCatalogue() : vueOngletComposition()}\n\n    <div style=\"margin-top: 24px;\">\n      <button class=\"btn-secondary\" data-action=\"aller-sauvegarde\" style=\"width: 100%;\">\n        SAUVEGARDE // IMPORT-EXPORT  ${ICONS.arrow}\n      <\u002Fbutton>\n    <\u002Fdiv>\n  `;\n}\n\nfunction vueOngletCatalogue() {\n  const exosActifs = State.exercices.filter(e => !e.archive);\n  const exosArchives = State.exercices.filter(e => e.archive);\n\n  const listeActifs = exosActifs.length === 0 ? `\n    <div class=\"empty-state\">\n      <div class=\"uplabel\" style=\"margin-bottom: 8px;\">// CATALOGUE VIDE<\u002Fdiv>\n      <p>Aucun exercice au catalogue.<\u002Fp>\n    <\u002Fdiv>\n  ` : exosActifs.map(e => {\n    const meilleur = meilleurPR(e.id);\n    return `\n      <div class=\"exercise-row\">\n        <span class=\"exercise-emoji\">${GROUPES[e.groupeMusculaire].emoji}<\u002Fspan>\n        <div style=\"flex: 1; min-width: 0;\">\n          <div class=\"name\">${escapeHtml(e.nom)}<\u002Fdiv>\n          <div class=\"mono\" style=\"font-size: 0.65rem; color: var(--muted); margin-top: 2px;\">\n            ${e.series}×${e.repsPrevues} · ${e.poidsInitial}kg base${meilleur ? ` · PR ${meilleur.oneRM}kg` : ''}\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"row-actions\">\n          <button class=\"btn-small btn-secondary\" data-action=\"editer-exercice\" data-id=\"${e.id}\">MOD<\u002Fbutton>\n          <button class=\"btn-small btn-secondary\" data-action=\"archiver-exercice\" data-id=\"${e.id}\">ARCH<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    `;\n  }).join('');\n\n  const blocArchives = exosArchives.length === 0 ? '' : `\n    <details style=\"margin-top: 16px;\">\n      <summary class=\"uplabel\" style=\"cursor: pointer; padding: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;\">\n        // ARCHIVÉS  [${exosArchives.length}]\n      <\u002Fsummary>\n      <div class=\"card\" style=\"margin-top: 6px;\">\n        ${exosArchives.map(e => `\n          <div class=\"exercise-row\">\n            <span class=\"exercise-emoji\">${GROUPES[e.groupeMusculaire].emoji}<\u002Fspan>\n            <span class=\"name\">${escapeHtml(e.nom)}<\u002Fspan>\n            <button class=\"btn-small btn-secondary\" data-action=\"desarchiver-exercice\" data-id=\"${e.id}\">\n              RESTAURER\n            <\u002Fbutton>\n          <\u002Fdiv>\n        `).join('')}\n      <\u002Fdiv>\n    <\u002Fdetails>\n  `;\n\n  return `\n    <button data-action=\"ajouter-exercice\" style=\"width: 100%; margin-bottom: 14px;\">\n      + AJOUTER UN EXERCICE\n    <\u002Fbutton>\n    <div class=\"card\">\n      ${listeActifs}\n    <\u002Fdiv>\n    ${blocArchives}\n  `;\n}\n\nfunction vueOngletComposition() {\n  const colors = SEANCE_COLORS;\n  const n = State.seances.length;\n  const stepper = `\n    <div class=\"card nb-seances\">\n      <div>\n        <div class=\"uplabel\">// SÉANCES PAR SEMAINE<\u002Fdiv>\n        <div class=\"mono\" style=\"color: var(--muted); font-size: 0.72rem; margin-top: 4px;\">La semaine passe automatiquement une fois toutes les séances faites.<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"nb-stepper\">\n        <button class=\"btn-secondary\" data-action=\"nb-seances\" data-delta=\"-1\" ${n <= 1 ? 'disabled' : ''} aria-label=\"Moins\">−<\u002Fbutton>\n        <span class=\"nb-value tabular\">${n}<\u002Fspan>\n        <button class=\"btn-secondary\" data-action=\"nb-seances\" data-delta=\"1\" ${n >= 7 ? 'disabled' : ''} aria-label=\"Plus\">+<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>`;\n  return stepper + State.seances.map((s, i) => {\n    const exos = s.exercicesIds\n      .map(id => State.exercices.find(e => e.id === id))\n      .filter(Boolean);\n\n    const listeExos = exos.length === 0 ? `\n      <p class=\"text-muted mono\" style=\"font-size: 0.8rem;\">// vide // ajoute des exercices ↓<\u002Fp>\n    ` : exos.map((e, idx) => `\n      <div class=\"exercise-row\">\n        <span class=\"mono\" style=\"font-size: 0.65rem; color: var(--muted); width: 18px;\">${String(idx+1).padStart(2,'0')}<\u002Fspan>\n        <span class=\"exercise-emoji\">${GROUPES[e.groupeMusculaire].emoji}<\u002Fspan>\n        <span class=\"name\">${escapeHtml(e.nom)}<\u002Fspan>\n        <div class=\"row-actions\">\n          <button class=\"btn-small btn-secondary\" data-action=\"monter-exo\" data-seance=\"${s.id}\" data-idx=\"${idx}\" ${idx === 0 ? 'disabled' : ''}>▲<\u002Fbutton>\n          <button class=\"btn-small btn-secondary\" data-action=\"descendre-exo\" data-seance=\"${s.id}\" data-idx=\"${idx}\" ${idx === exos.length - 1 ? 'disabled' : ''}>▼<\u002Fbutton>\n          <button class=\"btn-small btn-danger\" data-action=\"retirer-exo\" data-seance=\"${s.id}\" data-id=\"${e.id}\">✕<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    `).join('');\n\n    return `\n      <div class=\"card card-stripe\" style=\"--stripe: ${colors[i % colors.length]};\">\n        <div class=\"flex-between mb-12\" style=\"gap: 8px;\">\n          <span class=\"seance-index\">${String(i+1).padStart(2,'0')}//<\u002Fspan>\n          <input type=\"text\" data-action=\"renommer-seance\" data-id=\"${s.id}\"\n                 value=\"${escapeHtml(s.nom)}\"\n                 style=\"font-family: var(--f-display); font-weight: 900; font-size: 1.3rem; letter-spacing: -0.02em; padding: 8px 10px; background: var(--surface2); flex: 1;\">\n        <\u002Fdiv>\n        ${listeExos}\n        <button class=\"btn-secondary mt-16\" data-action=\"ajouter-exo-seance\" data-id=\"${s.id}\" style=\"width: 100%;\">\n          + AJOUTER UN EXO\n        <\u002Fbutton>\n      <\u002Fdiv>\n    `;\n  }).join('');\n}\n\n/* ============================================================================\n   SECTION 10 : VUE 4 - HISTORIQUE\n   ============================================================================ */\n\n// Vue Planning : choix du jour de chaque séance pour une semaine donnée\nfunction vuePlanning() {\n  const lundi = State.vueParams.lundi ? depuisIso(State.vueParams.lundi) : lundiCiblePlanning();\n  const lundiIso = isoLocal(lundi);\n  const plan = getPlanning(lundiIso);\n  const colors = SEANCE_COLORS;\n  const aujIso = isoLocal(new Date());\n\n  const lignes = State.seances.map((s, i) => `\n    <div class=\"card card-stripe\" style=\"--stripe: ${colors[i % colors.length]}; padding: 12px 14px;\">\n      <div class=\"seance-title-row\" style=\"margin-bottom: 10px;\">\n        <span class=\"seance-index\">${String(i + 1).padStart(2, '0')}//<\u002Fspan>\n        <span class=\"seance-name\" style=\"font-size: 1.1rem;\">${escapeHtml(s.nom)}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"day-chips\">\n        ${JOURS.map((j, idx) => `<button class=\"day-chip ${plan[s.id] === idx ? 'active' : ''}\" style=\"--c: ${colors[i % colors.length]};\" data-action=\"planif-jour\" data-lundi=\"${lundiIso}\" data-seance=\"${s.id}\" data-jour=\"${idx}\">${j}<\u002Fbutton>`).join('')}\n      <\u002Fdiv>\n    <\u002Fdiv>`).join('');\n\n  const recap = JOURS_LONGS.map((jl, idx) => {\n    const date = ajouterJours(lundi, idx);\n    const duJour = State.seances.map((s, i) => ({ s, i })).filter(({ s }) => plan[s.id] === idx);\n    const contenu = duJour.length === 0\n      ? `<span class=\"mono\" style=\"color: var(--faint); font-size: 0.75rem;\">Repos<\u002Fspan>`\n      : duJour.map(({ s, i }) => {\n          const exos = s.exercicesIds.map(id => State.exercices.find(e => e.id === id)).filter(Boolean);\n          return `<div class=\"recap-seance\" style=\"--c: ${colors[i % colors.length]};\">\n              <div class=\"recap-seance-name\">${escapeHtml(s.nom)}<\u002Fdiv>\n              <div class=\"tag-row\">${exos.length\n                ? exos.map(e => `<span class=\"exercise-tag\"><span class=\"exercise-emoji\">${GROUPES[e.groupeMusculaire].emoji}<\u002Fspan>${escapeHtml(e.nom)}<\u002Fspan>`).join('')\n                : '<span class=\"mono\" style=\"color: var(--muted); font-size: 0.72rem;\">aucun exo<\u002Fspan>'}<\u002Fdiv>\n            <\u002Fdiv>`;\n        }).join('');\n    return `<div class=\"recap-day ${isoLocal(date) === aujIso ? 'today' : ''}\">\n        <div class=\"recap-day-label\"><span>${jl}<\u002Fspan><span class=\"mono\">${date.getDate()}<\u002Fspan><\u002Fdiv>\n        <div class=\"recap-day-body\">${contenu}<\u002Fdiv>\n      <\u002Fdiv>`;\n  }).join('');\n\n  return `\n    <div class=\"header\">\n      <button class=\"icon-btn\" data-action=\"retour-accueil\" aria-label=\"Retour\">${ICONS.back}<\u002Fbutton>\n      <div class=\"header-titlewrap\">\n        <div class=\"uplabel\">// PROGRAMMATION<\u002Fdiv>\n        <h1 style=\"font-size: 1.55rem;\">PLANNING<span class=\"text-lime\">_<\u002Fspan><\u002Fh1>\n      <\u002Fdiv>\n      ${themeToggleBtn()}\n    <\u002Fdiv>\n\n    <div class=\"wk-nav\">\n      <button class=\"btn-small btn-secondary\" data-action=\"ouvrir-planning\" data-lundi=\"${isoLocal(ajouterJours(lundi, -7))}\" aria-label=\"Semaine précédente\">‹<\u002Fbutton>\n      <span class=\"mono\">Semaine ${libelleSemaine(lundi)}<\u002Fspan>\n      <button class=\"btn-small btn-secondary\" data-action=\"ouvrir-planning\" data-lundi=\"${isoLocal(ajouterJours(lundi, 7))}\" aria-label=\"Semaine suivante\">›<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div class=\"section-head\">\n      <span class=\"uplabel\">// JOUR DE CHAQUE SÉANCE<\u002Fspan>\n      <button class=\"btn-small btn-secondary\" data-action=\"planif-auto\" data-lundi=\"${lundiIso}\">RÉPARTITION AUTO<\u002Fbutton>\n    <\u002Fdiv>\n    ${lignes}\n\n    <div class=\"section-head\" style=\"margin-top: 20px;\">\n      <span class=\"uplabel\">// EXOS PRÉVUS DANS LA SEMAINE<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"card\" style=\"padding: 4px 14px;\">${recap}<\u002Fdiv>\n\n    <button data-action=\"retour-accueil\" style=\"width: 100%; margin-top: 14px;\">VALIDER LE PLANNING ${ICONS.arrow}<\u002Fbutton>\n  `;\n}\n\nfunction vueHistorique() {\n  // Mode actif : 'exercice' ou 'seance'\n  const mode = State.vueParams.modeHistorique || 'exercice';\n\n  const onglets = `\n    <div class=\"tabs\">\n      <button class=\"tab ${mode === 'exercice' ? 'active' : ''}\" data-action=\"mode-historique\" data-mode=\"exercice\">\n        Par exercice\n      <\u002Fbutton>\n      <button class=\"tab ${mode === 'seance' ? 'active' : ''}\" data-action=\"mode-historique\" data-mode=\"seance\">\n        Par séance\n      <\u002Fbutton>\n    <\u002Fdiv>\n  `;\n\n  const contenu = mode === 'exercice'\n    ? vueHistoriqueParExercice()\n    : vueHistoriqueParSeance();\n\n  return `\n    <div class=\"header\">\n      <button class=\"icon-btn\" data-action=\"retour-accueil\" aria-label=\"Retour\">${ICONS.back}<\u002Fbutton>\n      <div class=\"header-titlewrap\">\n        <div class=\"uplabel\">// JOURNAL<\u002Fdiv>\n        <h1 style=\"font-size: 1.55rem;\">HISTORIQUE<span class=\"text-lime\">_<\u002Fspan><\u002Fh1>\n      <\u002Fdiv>\n      ${themeToggleBtn()}\n    <\u002Fdiv>\n    ${onglets}\n    ${contenu}\n  `;\n}\n\n// Sous-vue : Historique filtré par exercice (avec sparkline grosse)\nfunction vueHistoriqueParExercice() {\n  const exerciceIdSel = State.vueParams.exerciceId || '';\n  const inclureArchives = State.vueParams.inclureArchives || false;\n\n  const exosListe = State.exercices\n    .filter(e => inclureArchives || !e.archive)\n    .sort((a, b) => a.nom.localeCompare(b.nom));\n\n  const optionsExos = '<option value=\"\">— Choisir un exercice —<\u002Foption>' +\n    exosListe.map(e =>\n      `<option value=\"${e.id}\" ${e.id === exerciceIdSel ? 'selected' : ''}>\n         ${GROUPES[e.groupeMusculaire].emoji} ${escapeHtml(e.nom)}${e.archive ? ' (archivé)' : ''}\n       <\u002Foption>`\n    ).join('');\n\n  let header = '';\n  let tableau = '';\n  if (exerciceIdSel) {\n    const exo = State.exercices.find(e => e.id === exerciceIdSel);\n    const histo = histoExercice(exerciceIdSel, 20);\n    const histoPoids = histo.map(p => p.poids);\n    const meilleur = meilleurPR(exerciceIdSel);\n\n    if (histo.length > 0 && exo) {\n      header = `\n        <div class=\"card\" style=\"position: relative; overflow: hidden;\">\n          <div class=\"flex-between\" style=\"margin-bottom: 14px; align-items: flex-start;\">\n            <div>\n              <div class=\"uplabel\" style=\"margin-bottom: 4px;\">COURBE // ${exo.series}×${exo.repsPrevues}<\u002Fdiv>\n              <div class=\"seance-title-row\">\n                <span class=\"exercise-emoji\" style=\"font-size: 1.4rem;\">${GROUPES[exo.groupeMusculaire].emoji}<\u002Fspan>\n                <span class=\"seance-name\">${escapeHtml(exo.nom)}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            ${meilleur ? `<div class=\"pr-badge\">${ICONS.trophy}PR ${meilleur.oneRM}KG<\u002Fdiv>` : ''}\n          <\u002Fdiv>\n          <div style=\"background: var(--surface2); border-radius: 10px; padding: 14px; margin-top: 4px;\">\n            <div class=\"flex-between\" style=\"margin-bottom: 6px;\">\n              <span class=\"uplabel\">POIDS.kg // ${histo.length}_PTS<\u002Fspan>\n              <span class=\"mono\" style=\"font-size: 0.72rem; color: var(--lime); font-weight: 700;\">${histoPoids[0]}kg → ${histoPoids[histoPoids.length-1]}kg<\u002Fspan>\n            <\u002Fdiv>\n            ${histoPoids.length >= 2\n              ? sparklineSVG(histoPoids, { w: 540, h: 80, color: 'var(--lime)', glow: true, fill: true })\n              : `<div class=\"text-muted text-center\" style=\"padding: 20px;\">Pas encore assez de points pour une courbe.<\u002Fdiv>`}\n          <\u002Fdiv>\n        <\u002Fdiv>\n      `;\n    }\n\n    const perfs = State.performances\n      .filter(p => p.exerciceId === exerciceIdSel)\n      .sort((a, b) => {\n        if (b.semaine !== a.semaine) return b.semaine - a.semaine;\n        return b.dateISO.localeCompare(a.dateISO);\n      });\n\n    if (perfs.length === 0) {\n      tableau = '<div class=\"empty-state\"><div class=\"uplabel\" style=\"margin-bottom:8px;\">// AUCUNE DONNÉE<\u002Fdiv><p>Aucune performance enregistrée pour cet exercice.<\u002Fp><\u002Fdiv>';\n    } else {\n      const lignes = perfs.map(p => {\n        const seance = State.seances.find(s => s.id === p.seanceId);\n        const nomSeance = seance ? seance.nom : '?';\n        const oneRM = epley1RM(p.poids, p.repsSerie4);\n        const estBest = meilleur && Math.abs(oneRM - meilleur.oneRM) < 0.01 && p.semaine === meilleur.semaine;\n        return `\n          <tr>\n            <td class=\"mono tabular\">${String(p.semaine).padStart(2,'0')}<\u002Ftd>\n            <td>${escapeHtml(nomSeance)}<\u002Ftd>\n            <td class=\"tabular\">${p.poids}kg<\u002Ftd>\n            <td class=\"tabular\">${p.repsSerie4}<\u002Ftd>\n            <td class=\"tabular\" style=\"color: ${estBest ? 'var(--magenta)' : 'var(--lime)'}; font-weight: 700;\">${oneRM}${estBest ? ' ★' : ''}<\u002Ftd>\n            <td>${escapeHtml(p.notes || '')}<\u002Ftd>\n            <td>\n              <button class=\"btn-small btn-secondary\" data-action=\"editer-perf\" data-id=\"${p.id}\">EDIT<\u002Fbutton>\n              <button class=\"btn-small btn-danger\" data-action=\"supprimer-perf\" data-id=\"${p.id}\">DEL<\u002Fbutton>\n            <\u002Ftd>\n          <\u002Ftr>\n        `;\n      }).join('');\n\n      tableau = `\n        <div class=\"table-wrapper mt-16\">\n          <table>\n            <thead>\n              <tr><th>Sem<\u002Fth><th>Séance<\u002Fth><th>Poids<\u002Fth><th>Reps<\u002Fth><th>1RM<\u002Fth><th>Notes<\u002Fth><th><\u002Fth><\u002Ftr>\n            <\u002Fthead>\n            <tbody>${lignes}<\u002Ftbody>\n          <\u002Ftable>\n        <\u002Fdiv>\n      `;\n    }\n  }\n\n  return `\n    <div class=\"card\">\n      <label style=\"margin-top: 0;\">// EXERCICE<\u002Flabel>\n      <select id=\"select-exo-historique\">${optionsExos}<\u002Fselect>\n      <label style=\"display: flex; align-items: center; gap: 8px; margin-top: 14px; text-transform: none; letter-spacing: 0; font-family: inherit;\">\n        <input type=\"checkbox\" id=\"chk-inclure-archives\" ${inclureArchives ? 'checked' : ''} style=\"width: auto;\">\n        <span style=\"color: var(--text); font-size: 0.85rem;\">Inclure les exercices archivés<\u002Fspan>\n      <\u002Flabel>\n    <\u002Fdiv>\n    ${header}\n    ${tableau}\n  `;\n}\n\n// Sous-vue : Historique groupé par séance (semaine par semaine)\nfunction vueHistoriqueParSeance() {\n  const seanceIdSel = State.vueParams.seanceIdHist || '';\n\n  const optionsSeances = '<option value=\"\">— Choisir une séance —<\u002Foption>' +\n    State.seances.map(s =>\n      `<option value=\"${s.id}\" ${s.id === seanceIdSel ? 'selected' : ''}>\n         ${escapeHtml(s.nom)}\n       <\u002Foption>`\n    ).join('');\n\n  let contenuSeance = '';\n  if (seanceIdSel) {\n    const perfsSeance = State.performances.filter(p => p.seanceId === seanceIdSel);\n\n    if (perfsSeance.length === 0) {\n      contenuSeance = '<div class=\"empty-state\"><div class=\"uplabel\" style=\"margin-bottom: 8px;\">// AUCUNE DONNÉE<\u002Fdiv><p>Aucune séance enregistrée.<\u002Fp><\u002Fdiv>';\n    } else {\n      const parSemaine = {};\n      for (const p of perfsSeance) {\n        if (!parSemaine[p.semaine]) parSemaine[p.semaine] = [];\n        parSemaine[p.semaine].push(p);\n      }\n\n      const semainesTriees = Object.keys(parSemaine)\n        .map(Number)\n        .sort((a, b) => b - a);\n\n      contenuSeance = semainesTriees.map(sem => {\n        const perfs = parSemaine[sem];\n        const dateISO = perfs[0].dateISO;\n        const dateAffichee = new Date(dateISO).toLocaleDateString('fr-FR', {\n          day: 'numeric', month: 'short', year: 'numeric'\n        });\n        const commentaire = perfs[0].commentaireSeance || '';\n\n        const seance = State.seances.find(s => s.id === seanceIdSel);\n        const ordreExos = seance ? seance.exercicesIds : [];\n\n        const lignes = perfs\n          .slice()\n          .sort((a, b) => {\n            const ia = ordreExos.indexOf(a.exerciceId);\n            const ib = ordreExos.indexOf(b.exerciceId);\n            if (ia === -1 && ib === -1) return 0;\n            if (ia === -1) return 1;\n            if (ib === -1) return -1;\n            return ia - ib;\n          })\n          .map(p => {\n            const ex = State.exercices.find(e => e.id === p.exerciceId);\n            const nomExo = ex\n              ? `<span class=\"exercise-emoji\">${GROUPES[ex.groupeMusculaire].emoji}<\u002Fspan> ${escapeHtml(ex.nom)}`\n              : '<em style=\"color: var(--muted);\">(supprimé)<\u002Fem>';\n            return `\n              <tr>\n                <td>${nomExo}<\u002Ftd>\n                <td class=\"tabular\">${p.poids}kg<\u002Ftd>\n                <td class=\"tabular\">${p.repsSerie4}<\u002Ftd>\n                <td>${escapeHtml(p.notes || '')}<\u002Ftd>\n                <td>\n                  <button class=\"btn-small btn-secondary\" data-action=\"editer-perf\" data-id=\"${p.id}\">EDIT<\u002Fbutton>\n                  <button class=\"btn-small btn-danger\" data-action=\"supprimer-perf\" data-id=\"${p.id}\">DEL<\u002Fbutton>\n                <\u002Ftd>\n              <\u002Ftr>\n            `;\n          }).join('');\n\n        const blocCommentaire = commentaire\n          ? `<div class=\"notes-precedentes\" style=\"margin: 8px 0 12px;\">\n               <div class=\"notes-precedentes-label\">&gt;&gt; commentaire séance<\u002Fdiv>\n               <div class=\"notes-precedentes-content\">${escapeHtml(commentaire)}<\u002Fdiv>\n             <\u002Fdiv>`\n          : '';\n\n        return `\n          <div class=\"card\">\n            <div class=\"flex-between mb-12\">\n              <div class=\"seance-title-row\">\n                <span class=\"seance-index mono\">SEM_${String(sem).padStart(2,'0')}<\u002Fspan>\n                <span class=\"seance-name\" style=\"font-size: 1.2rem;\">${escapeHtml(seance ? seance.nom : '')}<\u002Fspan>\n              <\u002Fdiv>\n              <span class=\"mono\" style=\"font-size: 0.72rem; color: var(--muted); letter-spacing: 0.08em;\">${dateAffichee}<\u002Fspan>\n            <\u002Fdiv>\n            ${blocCommentaire}\n            <div class=\"table-wrapper\">\n              <table>\n                <thead>\n                  <tr><th>Exercice<\u002Fth><th>Poids<\u002Fth><th>Reps<\u002Fth><th>Notes<\u002Fth><th><\u002Fth><\u002Ftr>\n                <\u002Fthead>\n                <tbody>${lignes}<\u002Ftbody>\n              <\u002Ftable>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        `;\n      }).join('');\n    }\n  }\n\n  return `\n    <div class=\"card\">\n      <label style=\"margin-top: 0;\">// SÉANCE<\u002Flabel>\n      <select id=\"select-seance-historique\">${optionsSeances}<\u002Fselect>\n    <\u002Fdiv>\n    ${contenuSeance}\n  `;\n}\n\n/* ============================================================================\n   SECTION 11 : VUE SAUVEGARDE\n   ============================================================================ */\n\nfunction vueSauvegarde() {\n  const nbExos = State.exercices.length;\n  const nbPerfs = State.performances.length;\n  const nbSeances = State.seances.length;\n  const dernierePerf = State.performances\n    .slice()\n    .sort((a, b) => b.dateISO.localeCompare(a.dateISO))[0];\n  const dateDerniere = dernierePerf\n    ? new Date(dernierePerf.dateISO).toLocaleDateString('fr-FR') + ' · ' + new Date(dernierePerf.dateISO).toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'})\n    : '—';\n\n  return `\n    <div class=\"header\">\n      <button class=\"icon-btn\" data-action=\"aller-parametrage\" aria-label=\"Retour\">${ICONS.back}<\u002Fbutton>\n      <div class=\"header-titlewrap\">\n        <div class=\"uplabel\">// DONNÉES<\u002Fdiv>\n        <h1 style=\"font-size: 1.55rem;\">SAUVEGARDE<span class=\"text-lime\">_<\u002Fspan><\u002Fh1>\n      <\u002Fdiv>\n      ${themeToggleBtn()}\n    <\u002Fdiv>\n    <div class=\"card\">\n      <div class=\"uplabel\" style=\"margin-bottom: 6px;\">// STATS<\u002Fdiv>\n      <div class=\"stat-line\">\n        <span class=\"label\">Exercices catalogue<\u002Fspan>\n        <span class=\"value tabular\">${nbExos}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"stat-line\">\n        <span class=\"label\">Séances configurées<\u002Fspan>\n        <span class=\"value tabular\">${nbSeances}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"stat-line\">\n        <span class=\"label\">Performances<\u002Fspan>\n        <span class=\"value tabular text-lime\">${nbPerfs}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"stat-line\">\n        <span class=\"label\">Dernière entrée<\u002Fspan>\n        <span class=\"mono\" style=\"font-size: 0.8rem; color: var(--text);\">${dateDerniere}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <button data-action=\"exporter\" style=\"width: 100%; margin-bottom: 10px;\">\n      ${ICONS.arrow}  EXPORTER (JSON)\n    <\u002Fbutton>\n    <button class=\"btn-secondary\" data-action=\"importer\" style=\"width: 100%;\">\n      ${ICONS.arrow}  IMPORTER UNE SAUVEGARDE\n    <\u002Fbutton>\n    <input type=\"file\" id=\"input-import\" accept=\".json,application/json\" style=\"display: none;\">\n    <div class=\"warning-box mt-16\">\n      <strong style=\"font-family: var(--f-mono); font-size: 0.7rem; color: var(--amber); display: block; margin-bottom: 4px;\">// ATTENTION<\u002Fstrong>\n      L'import écrase <strong>toutes<\u002Fstrong> les données actuelles. Exporte d'abord par sécurité.\n    <\u002Fdiv>\n\n    <div class=\"uplabel\" style=\"margin: 24px 0 6px;\">// NOUVEAU PROGRAMME<\u002Fdiv>\n    <button class=\"btn-danger\" data-action=\"reinitialiser-programme\" style=\"width: 100%;\">\n      ${ICONS.arrow}  REMETTRE À ZÉRO LE PROGRAMME\n    <\u002Fbutton>\n    <div class=\"warning-box mt-16\">\n      <strong style=\"font-family: var(--f-mono); font-size: 0.7rem; color: var(--amber); display: block; margin-bottom: 4px;\">// ATTENTION<\u002Fstrong>\n      Efface tout l'historique de performances, remet la semaine à 1 et vide les brouillons en cours. Le catalogue d'exercices et la composition des séances sont conservés. Exporte d'abord par sécurité.\n    <\u002Fdiv>\n  `;\n}\n\n/* ============================================================================\n   SECTION 12 : RENDU PRINCIPAL ET ROUTAGE\n   ============================================================================ */\n\nfunction render() {\n  const app = document.getElementById('app');\n  let contenu = '';\n\n  switch (State.vue) {\n    case 'accueil':      contenu = vueAccueil(); break;\n    case 'session':      contenu = vueSession(); break;\n    case 'parametrage':  contenu = vueParametrage(); break;\n    case 'historique':   contenu = vueHistorique(); break;\n    case 'sauvegarde':   contenu = vueSauvegarde(); break;\n    case 'planning':     contenu = vuePlanning(); break;\n    default:             contenu = vueAccueil();\n  }\n\n  app.innerHTML = contenu + barreNavigation();\n  attacherEvenements();\n  attacherSauvegardeBrouillon();\n  adoucirLibelles(document.body);\n  hydraterSlotsImages();\n  activerDragDropSlots();\n}\n\nfunction barreNavigation() {\n  const v = State.vue;\n  const isParam = v === 'parametrage' || v === 'sauvegarde';\n  return `\n    <nav class=\"bottom-nav\">\n      <button class=\"${v === 'accueil' ? 'active' : ''}\" data-action=\"nav\" data-vue=\"accueil\">\n        <span class=\"icon-svg\">${ICONS.home}<\u002Fspan><span>ACCUEIL<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"${isParam ? 'active' : ''}\" data-action=\"nav\" data-vue=\"parametrage\">\n        <span class=\"icon-svg\">${ICONS.gear}<\u002Fspan><span>RÉGLAGES<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"${v === 'historique' ? 'active' : ''}\" data-action=\"nav\" data-vue=\"historique\">\n        <span class=\"icon-svg\">${ICONS.chart}<\u002Fspan><span>DONNÉES<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fnav>\n  `;\n}\n\n/* ============================================================================\n   SECTION 13 : GESTION DES ÉVÉNEMENTS (délégation)\n   ============================================================================ */\n\n// Sauvegarde automatique du brouillon de séance à chaque saisie (input)\nfunction attacherSauvegardeBrouillon() {\n  if (State.vue !== 'session') return;\n  const app = document.getElementById('app');\n  if (!app) return;\n  app.addEventListener('input', (e) => {\n    if (!e.target.matches('[data-champ], #commentaire-seance')) return;\n    capturerBrouillon(State.vueParams.seanceId);\n    // Met à jour le 1RM live si poids/reps changent\n    if (e.target.matches('[data-champ=\"poids\"], [data-champ=\"reps\"]')) {\n      majOneRMLive(e.target.closest('[data-exercice-id]'));\n    }\n  });\n}\n\n// Recalcule l'estimation 1RM affichée dans une carte exo après saisie\nfunction majOneRMLive(carte) {\n  if (!carte) return;\n  const poids = parseFloat(carte.querySelector('[data-champ=\"poids\"]').value) || 0;\n  const reps = parseInt(carte.querySelector('[data-champ=\"reps\"]').value) || 0;\n  const cible = carte.querySelector('.trend-value');\n  if (cible) {\n    cible.innerHTML = epley1RM(poids, reps) + '<span style=\"color: var(--muted); font-size: 0.7rem; margin-left: 2px;\">kg<\u002Fspan>';\n  }\n}\n\nfunction attacherEvenements() {\n  // Délégation : on attache un seul listener sur #app pour tous les boutons/cards\n  document.getElementById('app').onclick = async (e) => {\n    const target = e.target.closest('[data-action]');\n    if (!target) return;\n    const action = target.dataset.action;\n\n    switch (action) {\n      // === Navigation ===\n      case 'nav':              naviguer(target.dataset.vue); break;\n      case 'retour-accueil':   naviguer('accueil'); break;\n      case 'aller-parametrage': naviguer('parametrage'); break;\n\n      // === Thème ===\n      case 'toggle-theme':     toggleTheme(); break;\n      case 'variante':         appliquerVariante(target.dataset.v); render(); break;\n\n      // === Image slots ===\n      case 'open-slot':        await ouvrirPickerSlot(target.dataset.slotId); break;\n      case 'clear-slot':       {\n        e.preventDefault();\n        e.stopPropagation();\n        const slotId = target.dataset.slotId;\n        const ok = await confirmer('Supprimer cette image ?', 'Supprimer');\n        if (ok) {\n          effacerSlotImage(slotId);\n          hydraterSlotsImages();\n          toast('Image supprimée');\n        }\n        break;\n      }\n\n      // === Ajustement des inputs (boutons ± de la session) ===\n      case 'adjust': {\n        e.preventDefault();\n        const exoId = target.dataset.exo;\n        const champ = target.dataset.champ;\n        const delta = parseFloat(target.dataset.delta);\n        const input = document.querySelector(`input[data-champ=\"${champ}\"][data-exo=\"${exoId}\"]`);\n        if (input) {\n          const current = parseFloat(input.value) || 0;\n          const next = Math.max(0, +(current + delta).toFixed(2));\n          input.value = champ === 'reps' ? Math.round(next) : next;\n          // Persiste immédiatement le brouillon après un ajustement\n          if (State.vue === 'session') capturerBrouillon(State.vueParams.seanceId);\n          // Feedback visuel léger : flash de l'input\n          input.style.transition = 'color 0.15s';\n          const original = input.style.color;\n          input.style.color = delta > 0 ? 'var(--lime)' : 'var(--muted)';\n          setTimeout(() => { input.style.color = original; }, 150);\n        }\n        break;\n      }\n      case 'aller-sauvegarde': naviguer('sauvegarde'); break;\n      case 'ouvrir-seance':    naviguer('session', { seanceId: target.dataset.id }); break;\n\n      // === Planning ===\n      case 'ouvrir-planning':  naviguer('planning', { lundi: target.dataset.lundi }); break;\n      case 'planif-jour':\n        await definirJourSeance(target.dataset.lundi, target.dataset.seance, parseInt(target.dataset.jour));\n        await rafraichir();\n        break;\n      case 'planif-auto':\n        await repartitionAuto(target.dataset.lundi);\n        await rafraichir();\n        break;\n      case 'nb-seances':\n        await changerNbSeances(State.seances.length + parseInt(target.dataset.delta));\n        break;\n\n      // === Accueil ===\n      case 'reinitialiser-programme': {\n        const ok = await confirmer(\n          `Tout l'historique de performances sera effacé et la semaine remise à 1. Le catalogue d'exercices et les séances sont conservés. Cette action est irréversible.`,\n          'Remettre à zéro le programme'\n        );\n        if (ok) {\n          await reinitialiserProgramme();\n          await rafraichir();\n          naviguer('accueil');\n          toast('Programme réinitialisé — nouveau départ, semaine 1');\n        }\n        break;\n      }\n      case 'passer-semaine': {\n        const ok = await confirmer(\n          `Vous êtes en semaine ${State.etat.semaineCourante}. Passer manuellement à la semaine ${State.etat.semaineCourante + 1} ? Les séances faites cette semaine seront réinitialisées.`,\n          'Passer à la semaine suivante'\n        );\n        if (ok) {\n          await passerSemaineSuivante();\n          await rafraichir();\n          toast('Passé à la semaine ' + State.etat.semaineCourante);\n        }\n        break;\n      }\n\n      // === Session : enregistrement ===\n      case 'enregistrer-seance': {\n        await traiterEnregistrementSeance();\n        break;\n      }\n\n      // === Paramétrage : onglets ===\n      case 'onglet':\n        State.ongletParam = target.dataset.onglet;\n        render();\n        break;\n\n      // === Catalogue : ajouter / modifier / archiver ===\n      case 'ajouter-exercice':    await ouvrirModaleExercice(null); break;\n      case 'editer-exercice':     await ouvrirModaleExercice(target.dataset.id); break;\n      case 'archiver-exercice':   await archiverExercice(target.dataset.id); break;\n      case 'desarchiver-exercice': await desarchiverExercice(target.dataset.id); break;\n\n      // === Composition des séances ===\n      case 'monter-exo':           await deplacerExo(target.dataset.seance, parseInt(target.dataset.idx), -1); break;\n      case 'descendre-exo':        await deplacerExo(target.dataset.seance, parseInt(target.dataset.idx), 1); break;\n      case 'retirer-exo':          await retirerExoDeSeance(target.dataset.seance, target.dataset.id); break;\n      case 'ajouter-exo-seance':   await ouvrirModaleAjoutExoSeance(target.dataset.id); break;\n\n      // === Historique ===\n      case 'mode-historique':\n        State.vueParams.modeHistorique = target.dataset.mode;\n        render();\n        break;\n      case 'editer-perf':          await editerPerformance(target.dataset.id); break;\n      case 'supprimer-perf':       await supprimerPerformance(target.dataset.id); break;\n\n      // === Sauvegarde ===\n      case 'exporter':             exporterDonnees(); break;\n      case 'importer':             document.getElementById('input-import').click(); break;\n    }\n  };\n\n  // Champs dynamiques avec change/input\n  document.getElementById('app').oninput = (e) => {\n    // Renommer une séance en direct\n    if (e.target.dataset.action === 'renommer-seance') {\n      const seance = State.seances.find(s => s.id === e.target.dataset.id);\n      if (seance && e.target.value.trim()) {\n        seance.nom = e.target.value.trim();\n        putOne(STORES.SEANCES, seance);\n      }\n    }\n  };\n\n  // Select et checkbox de l'historique (mode par exercice)\n  const sel = document.getElementById('select-exo-historique');\n  if (sel) {\n    sel.addEventListener('change', (e) => {\n      State.vueParams.exerciceId = e.target.value;\n      render();\n    });\n  }\n  const chk = document.getElementById('chk-inclure-archives');\n  if (chk) {\n    chk.addEventListener('change', (e) => {\n      State.vueParams.inclureArchives = e.target.checked;\n      render();\n    });\n  }\n  // Select de l'historique (mode par séance)\n  const selSeance = document.getElementById('select-seance-historique');\n  if (selSeance) {\n    selSeance.addEventListener('change', (e) => {\n      State.vueParams.seanceIdHist = e.target.value;\n      render();\n    });\n  }\n\n  // Input de fichier pour import\n  const inputImport = document.getElementById('input-import');\n  if (inputImport) {\n    inputImport.addEventListener('change', importerDonnees);\n  }\n}\n\n/* ============================================================================\n   SECTION 14 : ACTIONS DÉTAILLÉES - SESSION\n   ============================================================================ */\n\nasync function traiterEnregistrementSeance() {\n  const seanceId = State.vueParams.seanceId;\n  const seance = State.seances.find(s => s.id === seanceId);\n  if (!seance) return;\n\n  // Collecte des données depuis le DOM\n  const cartes = document.querySelectorAll('[data-exercice-id]');\n  const donnees = {};\n  const erreurs = [];\n  const alertes = [];\n\n  for (const carte of cartes) {\n    const exerciceId = carte.dataset.exerciceId;\n    const exercice = State.exercices.find(e => e.id === exerciceId);\n    const poidsStr = carte.querySelector('[data-champ=\"poids\"]').value;\n    const repsStr = carte.querySelector('[data-champ=\"reps\"]').value;\n    const notes = carte.querySelector('[data-champ=\"notes\"]').value;\n\n    const poids = parseFloat(poidsStr);\n    const reps = parseInt(repsStr);\n\n    // Validation : poids obligatoire et >= 0\n    if (poidsStr === '' || isNaN(poids) || poids < 0) {\n      erreurs.push(`${exercice.nom} : le poids doit être renseigné et positif.`);\n      continue;\n    }\n    // Validation : reps obligatoire mais 0 autorisé (saisie explicite)\n    if (repsStr === '' || isNaN(reps) || reps < 0) {\n      erreurs.push(`${exercice.nom} : les reps série 4 doivent être renseignées (0 autorisé).`);\n      continue;\n    }\n\n    donnees[exerciceId] = { poids, reps, notes };\n\n    // Détection : suggestion d'augmentation de charge\n    if (reps > 15) {\n      alertes.push(`💡 ${exercice.nom} : tu as fait ${reps} reps (> 15), pense à augmenter la charge la prochaine fois.`);\n    }\n  }\n\n  if (erreurs.length > 0) {\n    await modal(`\n      <h3 style=\"margin-top: 0;\">⚠️ Erreurs de saisie<\u002Fh3>\n      ${erreurs.map(e => `<p>${escapeHtml(e)}<\u002Fp>`).join('')}\n      <div class=\"modal-actions\">\n        <button data-action=\"oui\">OK<\u002Fbutton>\n      <\u002Fdiv>\n    `);\n    setTimeout(() => {\n      const overlay = document.querySelector('.modal-overlay:last-child');\n      if (overlay) {\n        overlay.querySelector('button').onclick = () => overlay.fermer();\n      }\n    }, 0);\n    return;\n  }\n\n  // Confirmation avec affichage des alertes éventuelles\n  const commentaire = document.getElementById('commentaire-seance').value;\n  const messageConfirm = alertes.length > 0\n    ? `Enregistrer la séance ?<br><br>${alertes.map(a => `<div class=\"warning-box\">${escapeHtml(a)}<\u002Fdiv>`).join('')}`\n    : `Enregistrer la séance ?`;\n\n  const ok = await confirmer(messageConfirm, 'Enregistrer');\n  if (!ok) return;\n\n  // Stats pour l'animation de victoire (avant l'enregistrement, on lit l'état actuel)\n  const streakAvant = calculerStreak();\n  let prCount = 0;\n  let volume = 0;\n  for (const [exId, data] of Object.entries(donnees)) {\n    const exo = State.exercices.find(e => e.id === exId);\n    const series = exo ? exo.series : 4;\n    volume += data.poids * data.reps * series;\n    // Détection PR : le 1RM de cette série va-t-il dépasser le meilleur précédent ?\n    const meilleur = meilleurPR(exId);\n    const oneRM = epley1RM(data.poids, data.reps);\n    if (!meilleur || oneRM > meilleur.oneRM + 0.01) prCount++;\n  }\n\n  await enregistrerSeance(seanceId, donnees, commentaire);\n  effacerBrouillon(seanceId);\n  await rafraichir();\n  const streakApres = calculerStreak();\n  const streakDelta = Math.max(0, streakApres - streakAvant);\n\n  // Animation de victoire (durée ~2.4s)\n  jouerAnimationVictoire({\n    streak: streakApres,\n    prCount,\n    volume: Math.round(volume),\n  });\n\n  // On laisse l'animation jouer un peu avant de naviguer\n  setTimeout(() => {\n    naviguer('accueil');\n  }, 1500);\n}\n\n/* ============================================================================\n   SECTION 15 : ACTIONS DÉTAILLÉES - CATALOGUE\n   ============================================================================ */\n\nasync function ouvrirModaleExercice(exerciceId) {\n  const exercice = exerciceId\n    ? State.exercices.find(e => e.id === exerciceId)\n    : { nom: '', groupeMusculaire: 'epaules', repsPrevues: 10, series: 4, poidsInitial: 20, notesParDefaut: '' };\n\n  const optionsGroupes = Object.entries(GROUPES).map(([k, v]) =>\n    `<option value=\"${k}\" ${exercice.groupeMusculaire === k ? 'selected' : ''}>${v.emoji} ${v.label}<\u002Foption>`\n  ).join('');\n\n  const html = `\n    <h3 style=\"margin-top: 0;\">${exerciceId ? 'Modifier' : 'Ajouter'} un exercice<\u002Fh3>\n    <label>Nom *<\u002Flabel>\n    <input type=\"text\" id=\"ex-nom\" value=\"${escapeHtml(exercice.nom)}\" required>\n    <label>Groupe musculaire<\u002Flabel>\n    <select id=\"ex-groupe\">${optionsGroupes}<\u002Fselect>\n    <div class=\"input-group\">\n      <div>\n        <label>Reps prévues<\u002Flabel>\n        <input type=\"number\" id=\"ex-reps\" min=\"1\" value=\"${exercice.repsPrevues}\">\n      <\u002Fdiv>\n      <div>\n        <label>Nombre de séries<\u002Flabel>\n        <input type=\"number\" id=\"ex-series\" min=\"1\" value=\"${exercice.series}\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <label>Poids initial (kg)<\u002Flabel>\n    <input type=\"number\" id=\"ex-poids\" step=\"0.5\" min=\"0\" value=\"${exercice.poidsInitial}\">\n    <label>Notes par défaut<\u002Flabel>\n    <textarea id=\"ex-notes\" rows=\"2\">${escapeHtml(exercice.notesParDefaut || '')}<\u002Ftextarea>\n    <div class=\"modal-actions\">\n      <button class=\"btn-secondary\" data-action=\"annuler\">Annuler<\u002Fbutton>\n      <button data-action=\"valider\">${exerciceId ? 'Enregistrer' : 'Ajouter'}<\u002Fbutton>\n    <\u002Fdiv>\n  `;\n\n  modal(html);\n\n  setTimeout(() => {\n    const overlay = document.querySelector('.modal-overlay:last-child');\n    overlay.querySelector('[data-action=\"annuler\"]').onclick = () => overlay.fermer();\n    overlay.querySelector('[data-action=\"valider\"]').onclick = async () => {\n      const nom = overlay.querySelector('#ex-nom').value.trim();\n      if (!nom) { toast('Le nom est obligatoire'); return; }\n\n      const nouvel = {\n        id: exerciceId || uuid(),\n        nom,\n        groupeMusculaire: overlay.querySelector('#ex-groupe').value,\n        repsPrevues: parseInt(overlay.querySelector('#ex-reps').value) || 10,\n        series: parseInt(overlay.querySelector('#ex-series').value) || 4,\n        poidsInitial: parseFloat(overlay.querySelector('#ex-poids').value) || 0,\n        notesParDefaut: overlay.querySelector('#ex-notes').value,\n        archive: exercice.archive || false\n      };\n\n      await putOne(STORES.EXERCICES, nouvel);\n      overlay.fermer();\n      await rafraichir();\n      toast(exerciceId ? 'Exercice modifié' : 'Exercice ajouté');\n    };\n  }, 0);\n}\n\nasync function archiverExercice(exerciceId) {\n  // Vérifier si l'exercice est utilisé dans des séances\n  const seancesUtilisant = seancesUtilisantExercice(exerciceId);\n  if (seancesUtilisant.length > 0) {\n    const noms = seancesUtilisant.map(s => s.nom).join(', ');\n    await modal(`\n      <h3 style=\"margin-top: 0;\">⚠️ Impossible d'archiver<\u002Fh3>\n      <p>Cet exercice est encore présent dans : <strong>${escapeHtml(noms)}<\u002Fstrong>.<\u002Fp>\n      <p>Retirez-le d'abord de ces séances dans l'onglet \"Séances\".<\u002Fp>\n      <div class=\"modal-actions\">\n        <button data-action=\"ok\">OK<\u002Fbutton>\n      <\u002Fdiv>\n    `);\n    setTimeout(() => {\n      const overlay = document.querySelector('.modal-overlay:last-child');\n      overlay.querySelector('button').onclick = () => overlay.fermer();\n    }, 0);\n    return;\n  }\n\n  const ok = await confirmer('Archiver cet exercice ? Il restera consultable dans l\\'historique.', 'Archiver');\n  if (!ok) return;\n\n  const ex = State.exercices.find(e => e.id === exerciceId);\n  ex.archive = true;\n  await putOne(STORES.EXERCICES, ex);\n  await rafraichir();\n  toast('Exercice archivé');\n}\n\nasync function desarchiverExercice(exerciceId) {\n  const ex = State.exercices.find(e => e.id === exerciceId);\n  ex.archive = false;\n  await putOne(STORES.EXERCICES, ex);\n  await rafraichir();\n  toast('Exercice désarchivé');\n}\n\n/* ============================================================================\n   SECTION 16 : ACTIONS DÉTAILLÉES - COMPOSITION DES SÉANCES\n   ============================================================================ */\n\nasync function deplacerExo(seanceId, idx, direction) {\n  const seance = State.seances.find(s => s.id === seanceId);\n  const nouvelIdx = idx + direction;\n  if (nouvelIdx < 0 || nouvelIdx >= seance.exercicesIds.length) return;\n  const arr = [...seance.exercicesIds];\n  [arr[idx], arr[nouvelIdx]] = [arr[nouvelIdx], arr[idx]];\n  seance.exercicesIds = arr;\n  await putOne(STORES.SEANCES, seance);\n  await rafraichir();\n}\n\nasync function retirerExoDeSeance(seanceId, exerciceId) {\n  const seance = State.seances.find(s => s.id === seanceId);\n  seance.exercicesIds = seance.exercicesIds.filter(id => id !== exerciceId);\n  await putOne(STORES.SEANCES, seance);\n  await rafraichir();\n}\n\nasync function ouvrirModaleAjoutExoSeance(seanceId) {\n  const seance = State.seances.find(s => s.id === seanceId);\n  const disponibles = State.exercices\n    .filter(e => !e.archive && !seance.exercicesIds.includes(e.id))\n    .sort((a, b) => a.nom.localeCompare(b.nom));\n\n  if (disponibles.length === 0) {\n    await modal(`\n      <h3 style=\"margin-top: 0;\">Aucun exercice disponible<\u002Fh3>\n      <p>Tous vos exercices actifs sont déjà dans cette séance, ou votre catalogue est vide.<\u002Fp>\n      <div class=\"modal-actions\">\n        <button data-action=\"ok\">OK<\u002Fbutton>\n      <\u002Fdiv>\n    `);\n    setTimeout(() => {\n      const overlay = document.querySelector('.modal-overlay:last-child');\n      overlay.querySelector('button').onclick = () => overlay.fermer();\n    }, 0);\n    return;\n  }\n\n  const liste = disponibles.map(e => `\n    <div class=\"exercise-row\" style=\"cursor: pointer;\" data-exo-id=\"${e.id}\">\n      <span class=\"exercise-emoji\">${GROUPES[e.groupeMusculaire].emoji}<\u002Fspan>\n      <span class=\"name\">${escapeHtml(e.nom)}<\u002Fspan>\n      <button class=\"btn-small\" data-id=\"${e.id}\">Ajouter<\u002Fbutton>\n    <\u002Fdiv>\n  `).join('');\n\n  modal(`\n    <h3 style=\"margin-top: 0;\">Ajouter à ${escapeHtml(seance.nom)}<\u002Fh3>\n    <div>${liste}<\u002Fdiv>\n    <div class=\"modal-actions\">\n      <button class=\"btn-secondary\" data-action=\"fermer\">Fermer<\u002Fbutton>\n    <\u002Fdiv>\n  `);\n\n  setTimeout(() => {\n    const overlay = document.querySelector('.modal-overlay:last-child');\n    overlay.querySelector('[data-action=\"fermer\"]').onclick = () => overlay.fermer();\n    overlay.querySelectorAll('.btn-small[data-id]').forEach(btn => {\n      btn.onclick = async () => {\n        seance.exercicesIds.push(btn.dataset.id);\n        await putOne(STORES.SEANCES, seance);\n        overlay.fermer();\n        await rafraichir();\n        toast('Exercice ajouté');\n      };\n    });\n  }, 0);\n}\n\n/* ============================================================================\n   SECTION 17 : ACTIONS DÉTAILLÉES - HISTORIQUE\n   ============================================================================ */\n\nasync function editerPerformance(perfId) {\n  const perf = State.performances.find(p => p.id === perfId);\n  if (!perf) return;\n\n  modal(`\n    <h3 style=\"margin-top: 0;\">Modifier une performance<\u002Fh3>\n    <label>Semaine<\u002Flabel>\n    <input type=\"number\" id=\"p-sem\" min=\"1\" value=\"${perf.semaine}\">\n    <div class=\"input-group\">\n      <div>\n        <label>Poids (kg)<\u002Flabel>\n        <input type=\"number\" id=\"p-poids\" step=\"0.5\" min=\"0\" value=\"${perf.poids}\">\n      <\u002Fdiv>\n      <div>\n        <label>Reps série 4<\u002Flabel>\n        <input type=\"number\" id=\"p-reps\" min=\"0\" value=\"${perf.repsSerie4}\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <label>Notes<\u002Flabel>\n    <textarea id=\"p-notes\" rows=\"2\">${escapeHtml(perf.notes || '')}<\u002Ftextarea>\n    <label>Commentaire séance<\u002Flabel>\n    <textarea id=\"p-com\" rows=\"2\">${escapeHtml(perf.commentaireSeance || '')}<\u002Ftextarea>\n    <div class=\"modal-actions\">\n      <button class=\"btn-secondary\" data-action=\"annuler\">Annuler<\u002Fbutton>\n      <button data-action=\"valider\">Enregistrer<\u002Fbutton>\n    <\u002Fdiv>\n  `);\n\n  setTimeout(() => {\n    const overlay = document.querySelector('.modal-overlay:last-child');\n    overlay.querySelector('[data-action=\"annuler\"]').onclick = () => overlay.fermer();\n    overlay.querySelector('[data-action=\"valider\"]').onclick = async () => {\n      perf.semaine = parseInt(overlay.querySelector('#p-sem').value) || perf.semaine;\n      perf.poids = parseFloat(overlay.querySelector('#p-poids').value) || 0;\n      perf.repsSerie4 = parseInt(overlay.querySelector('#p-reps').value) || 0;\n      perf.notes = overlay.querySelector('#p-notes').value;\n      perf.commentaireSeance = overlay.querySelector('#p-com').value;\n      await putOne(STORES.PERFORMANCES, perf);\n      overlay.fermer();\n      await rafraichir();\n      toast('Performance modifiée');\n    };\n  }, 0);\n}\n\nasync function supprimerPerformance(perfId) {\n  const ok = await confirmer('Supprimer définitivement cette performance ?', 'Supprimer');\n  if (!ok) return;\n  await deleteOne(STORES.PERFORMANCES, perfId);\n  await rafraichir();\n  toast('Performance supprimée');\n}\n\n/* ============================================================================\n   SECTION 18 : ACTIONS DÉTAILLÉES - SAUVEGARDE\n   ============================================================================ */\n\nfunction exporterDonnees()
